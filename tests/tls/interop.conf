pid target/tls-interop/wws.pid;
events {
}
http {
    server {
        listen 127.0.0.1:0 ssl default_server;
        server_name localhost;
        ssl_certificate tests/tls/fixtures/fullchain.pem;
        ssl_certificate_key tests/tls/fixtures/leaf.key;
        ssl_protocols TLSv1.3;
        root tests/tls/webroot;
        index index.html;
    }
    server {
        listen 127.0.0.1:0 ssl;
        server_name alt.example;
        ssl_certificate tests/tls/fixtures/alt-fullchain.pem;
        ssl_certificate_key tests/tls/fixtures/alt.key;
        ssl_protocols TLSv1.3;
        root tests/tls/webroot;
        index index.html;
    }
}
