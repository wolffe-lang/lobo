# lobo-corpus: source=https://github.com/matrix-org/synapse/blob/be65a8ec0195955c15fdb179c9158b187638e39a/docs/reverse_proxy.md (the fenced nginx block), as conf.d/site.conf, wrapped in nginx/pkg-oss's packaged nginx.conf (BSD-2-Clause, d16a981d5921b9d27985a24998d3438fb73bb1d7) license=Apache-2.0
# lobo-corpus: edits=listen privileged N -> 18000+N; wrapper paths prefix-relative, logs -> logs/, pid -> logs/nginx.pid; ADDED the two ssl_certificate lines (lobo's TEST pair) the doc leaves to the reader — without them nginx -t refuses every 'listen … ssl' server; nothing stripped
# lobo-corpus: oracle-exit=1 lobo-exit=1 delta=both refuse — pinned: the "http2" parameter requires ngx_http_v2_module in conf.d/site.conf:2; lobo: directive "user" is not implemented in lobo (privilege drop is ws14's — run lobo as the target user for now (nginx only warns when unprivileged)) in nginx.conf:5; stock loads

user  nginx;
worker_processes  auto;

error_log  logs/error.log notice;
pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    include conf.d/*.conf;
}
