# lobo-corpus: source=https://github.com/benoitc/gunicorn/blob/afc7d2fd5dd9f1de455b1be6c10044030c0adf8e/tests/docker/uwsgi/nginx.conf (gunicorn's docker test rig) license=MIT
# lobo-corpus: edits=/etc/nginx/ -> prefix-relative; /var/log/nginx/ -> logs/; an absolute pid -> logs/nginx.pid (nginx -t opens it); /certs/server.{crt,key} -> certs/ (lobo's TEST pair); STRIPPED: docker-compose service hostnames (gunicorn, gunicorn-*) -> 127.0.0.1, same ports
# lobo-corpus: oracle-exit=0 lobo-exit=1 delta=lobo refuses, the pinned oracle loads: unknown directive "uwsgi_buffer_size" in nginx.conf:33
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log logs/access.log main;
    error_log logs/error.log debug;

    sendfile on;
    keepalive_timeout 65;

    upstream gunicorn {
        server 127.0.0.1:8000;
    }

    server {
        listen 8080;
        server_name localhost;

        # Increase buffer sizes for large headers
        uwsgi_buffer_size 32k;
        uwsgi_buffers 8 32k;
        uwsgi_busy_buffers_size 64k;

        # Read timeout for large responses
        uwsgi_read_timeout 300s;

        location / {
            uwsgi_pass gunicorn;
            include uwsgi_params;

            # Pass additional headers
            uwsgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
            uwsgi_param HTTP_X_REAL_IP $remote_addr;
        }
    }
}
