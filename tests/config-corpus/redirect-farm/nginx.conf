# wws-corpus: source=synthetic (the redirect/rewrite farm shape: apex-to-www, legacy paths, trailing-slash normalization) license=n/a-synthetic
# wws-corpus: oracle-exit=1 wws-exit=0 delta=oracle-build: pinned oracle is --without-http_rewrite_module, so `return`/`rewrite` are unknown there (probe p62); stock nginx accepts this config
worker_processes 1;

events {
    worker_connections 512;
}

http {
    server {
        listen 8080;
        server_name example.org;
        return 301 https://www.example.org$request_uri;
    }

    server {
        listen 8080;
        server_name old.example.org legacy.example.org;

        location /old-blog/ {
            rewrite ^/old-blog/(.*)$ https://blog.example.org/$1 permanent;
        }

        location = /promo {
            return 302 /campaign/2026;
        }

        location / {
            rewrite ^(.*[^/])$ $1/ permanent;
        }
    }
}
