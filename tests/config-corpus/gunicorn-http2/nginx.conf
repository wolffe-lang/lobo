# lobo-corpus: source=https://github.com/benoitc/gunicorn/blob/afc7d2fd5dd9f1de455b1be6c10044030c0adf8e/tests/docker/http2/nginx.conf (gunicorn's docker test rig) license=MIT
# lobo-corpus: edits=/etc/nginx/ -> prefix-relative; /var/log/nginx/ -> logs/; an absolute pid -> logs/nginx.pid (nginx -t opens it); /certs/server.{crt,key} -> certs/ (lobo's TEST pair); STRIPPED: docker-compose service hostnames (gunicorn, gunicorn-*) -> 127.0.0.1, same ports
# lobo-corpus: oracle-exit=1 lobo-exit=1 delta=both refuse — pinned: unknown directive "http2" in nginx.conf:32; lobo: unknown directive "early_hints" in nginx.conf:59 (ws41 made "http2" a named_error row; before, it stopped there); stock loads
worker_processes auto;
error_log logs/error.log warn;
pid logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log logs/access.log main;

    sendfile on;
    keepalive_timeout 65;

    upstream gunicorn_h2 {
        server 127.0.0.1:8443;
        keepalive 32;
    }

    server {
        listen 8444 ssl;
        http2 on;
        server_name localhost;

        ssl_certificate certs/fullchain.pem;
        ssl_certificate_key certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # HTTP/2 settings
        http2_max_concurrent_streams 128;

        # Health check endpoint
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        location / {
            # Proxy to gunicorn with HTTPS
            proxy_pass https://gunicorn_h2;
            proxy_http_version 1.1;
            proxy_ssl_verify off;
            proxy_ssl_server_name on;

            # Enable forwarding of 103 Early Hints from upstream
            # $http2 is set to "h2" when HTTP/2 is used, empty otherwise
            early_hints $http2;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Buffering settings
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
