# lobo-corpus: source=https://github.com/nginx/pkg-oss/blob/d16a981d5921b9d27985a24998d3438fb73bb1d7/debian/debian/nginx.conf (byte-identical to rpm/SOURCES/nginx.conf and alpine/alpine/nginx.conf; conf.d/default.conf is debian/debian/nginx.default.conf, identical across the three) license=BSD-2-Clause
# lobo-corpus: edits=/etc/nginx/ paths prefix-relative; /var/log/nginx/ -> logs/; an absolute pid -> logs/nginx.pid (nginx -t opens it); listen 80 -> 18080; mime.types is nginx-1.30.4's (the package installs the same file); nothing stripped
# lobo-corpus: oracle-exit=0 lobo-exit=0

user  nginx;
worker_processes  auto;

error_log  logs/error.log notice;
pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    include conf.d/*.conf;
}
