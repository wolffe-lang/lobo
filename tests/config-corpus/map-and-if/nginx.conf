# lobo-corpus: source=synthetic (the map + if footgun exhibits: LOBO-L001 fires on the if-in-location, LOBO-L003 on the alias off-by-slash) license=n/a-synthetic
# lobo-corpus: oracle-exit=1 lobo-exit=0 delta=oracle-build: pinned oracle is --without-http_rewrite_module, so `if`/`set`/`return` are unknown there (probe p44); stock nginx accepts this config
worker_processes 1;

events {
    worker_connections 512;
}

http {
    map $http_user_agent $is_bot {
        default 0;
        ~*bot 1;
        ~*crawler 1;
    }

    map $http_host $backend_pool {
        default app_a;
        b.example.org app_b;
        include pools.map;
    }

    server {
        listen 8080;
        server_name maps.example.org;

        location / {
            if ($is_bot) {
                return 429;
            }
            set $trace "$is_bot:$backend_pool";
            root /srv/www/site;
        }

        location /img {
            alias /srv/www/images/;
        }
    }
}
