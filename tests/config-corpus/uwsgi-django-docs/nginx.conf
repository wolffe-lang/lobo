# lobo-corpus: source=https://github.com/unbit/uwsgi-docs/blob/5784c30866a94942a5200db4d5f6c2850afb1caa/tutorials/Django_and_nginx.rst (the mysite_nginx.conf block), as conf.d/site.conf, wrapped in nginx/pkg-oss's packaged nginx.conf (BSD-2-Clause, d16a981d5921b9d27985a24998d3438fb73bb1d7) license=MIT
# lobo-corpus: edits=listen privileged N -> 18000+N; wrapper paths prefix-relative, logs -> logs/, pid -> logs/nginx.pid; include /path/to/your/mysite/uwsgi_params -> uwsgi_params (nginx-1.30.4's, which the tutorial says to copy); nothing stripped
# lobo-corpus: oracle-exit=0 lobo-exit=1 delta=lobo refuses, the pinned oracle loads: unknown directive "uwsgi_pass" in conf.d/site.conf:31

user  nginx;
worker_processes  auto;

error_log  logs/error.log notice;
pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    include conf.d/*.conf;
}
