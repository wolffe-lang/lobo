# lobo-corpus: source=https://github.com/netbox-community/netbox/blob/b56c866d4c23e8a9a4ecd4c0d85a04b4e83c286c/contrib/nginx.conf as conf.d/netbox.conf, wrapped in nginx/pkg-oss's packaged nginx.conf (BSD-2-Clause, d16a981d5921b9d27985a24998d3438fb73bb1d7) license=Apache-2.0
# lobo-corpus: edits=listen [::]:443/[::]:80 -> 18443/18080; the netbox.crt/.key pair -> certs/ (lobo's TEST pair); wrapper paths prefix-relative, logs -> logs/, pid -> logs/nginx.pid; nothing stripped
# lobo-corpus: oracle-exit=1 lobo-exit=1 delta=both refuse — pinned: unknown directive "return" in conf.d/netbox.conf:38; lobo: directive "user" is not implemented in lobo (privilege drop is ws14's — run lobo as the target user for now (nginx only warns when unprivileged)) in nginx.conf:5; stock loads

user  nginx;
worker_processes  auto;

error_log  logs/error.log notice;
pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    include conf.d/*.conf;
}
