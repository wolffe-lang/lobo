# lobo-corpus: source=synthetic (composed from nginx docs' documented patterns: gzip, expires, autoindex) license=n/a-synthetic
# lobo-corpus: oracle-exit=1 lobo-exit=0 delta=oracle-build: pinned oracle is --without-http_gzip_module, so `gzip` is unknown there (probe p61); stock nginx accepts this config
worker_processes auto;
error_log logs/error.log warn;
pid logs/lobo.pid;

events {
    worker_connections 4096;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    etag on;
    charset utf-8;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    server {
        listen 8080;
        listen [::]:8080;
        server_name static.example.org;
        root /srv/www/static;
        index index.html index.htm;

        location / {
            try_files $uri $uri/ =404;
        }

        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location = /favicon.ico {
            expires 7d;
            access_log off;
        }
    }
}
