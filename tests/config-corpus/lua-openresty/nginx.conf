# wws-corpus: source=synthetic (the OpenResty *_by_lua_block shape — the named_error exhibit: wws refuses BY NAME with the block brace-skipped; the class-C posture, never silent) license=n/a-synthetic
# wws-corpus: oracle-exit=1 wws-exit=1 delta=both fail with different sentences: oracle says unknown directive "content_by_lua_block" (probe p56, no lua module); wws names its named_error table row and still checks the REST of the config
worker_processes 1;

events {
    worker_connections 512;
}

http {
    lua_shared_dict cache 10m;

    server {
        listen 8080;
        server_name lua.example.org;

        location /hello {
            content_by_lua_block {
                ngx.say("hello_from_lua")
            }
        }

        location / {
            root /srv/www/site;
        }
    }
}
