# lobo-corpus: source=synthetic (composed from nginx docs' proxying + upstream keepalive patterns; also the LOBO-L002 lint exhibit) license=n/a-synthetic
# lobo-corpus: oracle-exit=0 lobo-exit=0
worker_processes auto;

events {
    worker_connections 2048;
}

http {
    proxy_set_header Host $host;

    upstream app_pool {
        server 127.0.0.1:9001;
        server 127.0.0.1:9002 weight=2;
        server 127.0.0.1:9003 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    server {
        listen 18081;
        server_name app.example.org;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        location / {
            proxy_pass http://app_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        location /health {
            proxy_pass http://app_pool;
        }
    }
}
