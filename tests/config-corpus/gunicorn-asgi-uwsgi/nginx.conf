# lobo-corpus: edits=listen 80 -> 18080; wrapper paths prefix-relative, logs -> logs/, pid -> logs/nginx.pid; STRIPPED: the compose service hostname gunicorn -> 127.0.0.1
# lobo-corpus: oracle-exit=1 lobo-exit=1 delta=both refuse — pinned: unknown directive "return" in conf.d/default.conf:11; lobo: unknown directive "uwsgi_pass" in conf.d/default.conf:6; stock loads

user  nginx;
worker_processes  auto;

error_log  logs/error.log notice;
pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    include conf.d/*.conf;
}
