# lobo-corpus: source=https://github.com/pallets/flask/blob/d73fa1cdcbd8b1465c151db8924ba58b1dd14e35/docs/deploying/nginx.rst (the code-block under 'nginx'), as conf.d/site.conf, wrapped in nginx/pkg-oss's packaged nginx.conf (BSD-2-Clause, d16a981d5921b9d27985a24998d3438fb73bb1d7) license=BSD-3-Clause
# lobo-corpus: edits=listen privileged N -> 18000+N; wrapper paths prefix-relative, logs -> logs/, pid -> logs/nginx.pid; nothing stripped
# lobo-corpus: oracle-exit=0 lobo-exit=0

user  nginx;
worker_processes  auto;

error_log  logs/error.log notice;
pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    include conf.d/*.conf;
}
