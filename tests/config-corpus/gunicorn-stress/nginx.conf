# lobo-corpus: source=https://github.com/benoitc/gunicorn/blob/afc7d2fd5dd9f1de455b1be6c10044030c0adf8e/tests/docker/stress/nginx.conf (gunicorn's docker test rig) license=MIT
# lobo-corpus: edits=/etc/nginx/ -> prefix-relative; /var/log/nginx/ -> logs/; an absolute pid -> logs/nginx.pid (nginx -t opens it); /certs/server.{crt,key} -> certs/ (lobo's TEST pair); STRIPPED: docker-compose service hostnames (gunicorn, gunicorn-*) -> 127.0.0.1, same ports
# lobo-corpus: oracle-exit=1 lobo-exit=1 delta=both refuse — pinned: unknown directive "return" in nginx.conf:38; lobo: directive "http2" is not implemented in lobo (named_error row since ws41) in nginx.conf:62; stock loads
# Stress-suite nginx. Each server block is one topology target:
#   :8461  proxy_pass to gthread over HTTP/1.1
#   :8463  proxy_pass to the asgi worker over HTTP/1.1 (HTTP, WS, streaming)
#   :8464  terminate TLS + HTTP/2 downstream, proxy to asgi over HTTP/1.1
#   :8466  uwsgi_pass to the asgi worker (uWSGI binary protocol upstream)
# HTTP/2 and uWSGI are downstream-only: the gunicorn upstream always sees
# HTTP/1.1 on the proxy blocks and the uWSGI protocol on the uwsgi block.

worker_processes auto;
events { worker_connections 4096; }

http {
    access_log off;
    error_log /dev/stderr warn;
    resolver 127.0.0.11 ipv6=off valid=10s;

    map $http_upgrade $connection_upgrade { default upgrade; '' ''; }

    upstream gunicorn_gthread { server 127.0.0.1:8000 max_fails=0; keepalive 32; }
    upstream gunicorn_asgi    { server 127.0.0.1:8000 max_fails=0; keepalive 32; }
    upstream gunicorn_h2      { server 127.0.0.1:8443 max_fails=0; keepalive 32; }
    upstream gunicorn_uwsgi   { server 127.0.0.1:8000 max_fails=0; }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 200m;

    # gthread behind nginx (HTTP/1.1)
    server {
        listen 8461;
        server_name localhost;
        location /health { return 200 'OK'; add_header Content-Type text/plain; }
        location /stream/ { proxy_buffering off; proxy_set_header Connection ''; proxy_pass http://gunicorn_gthread/; }
        location / { proxy_pass http://gunicorn_gthread; }
    }

    # asgi behind nginx (HTTP/1.1) with WebSocket + streaming
    server {
        listen 8463;
        server_name localhost;
        location /health { return 200 'OK'; add_header Content-Type text/plain; }
        location /ws/ {
            proxy_pass http://gunicorn_asgi;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
        location /stream/ { proxy_buffering off; proxy_set_header Connection ''; proxy_pass http://gunicorn_asgi/; }
        location / { proxy_pass http://gunicorn_asgi; }
    }

    # HTTP/2 (TLS) downstream, HTTP/1.1 upstream to asgi
    server {
        listen 8464 ssl;
        http2 on;
        server_name localhost;
        ssl_certificate certs/fullchain.pem;
        ssl_certificate_key certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        http2_max_concurrent_streams 128;
        location /health { return 200 'OK'; add_header Content-Type text/plain; }
        location / {
            proxy_pass https://gunicorn_h2;
            proxy_ssl_verify off;
            proxy_ssl_server_name on;
        }
    }

    # uwsgi_pass to the asgi worker (uWSGI protocol upstream)
    server {
        listen 8466;
        server_name localhost;
        uwsgi_read_timeout 300s;
        location /health { return 200 'OK'; add_header Content-Type text/plain; }
        location / {
            uwsgi_pass gunicorn_uwsgi;
            include uwsgi_params;
            uwsgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
            uwsgi_param HTTP_X_REAL_IP $remote_addr;
        }
    }
}
