# lobo-corpus: edits=listen privileged N -> 18000+N; wrapper paths prefix-relative, logs -> logs/, pid -> logs/nginx.pid; the letsencrypt pair -> certs/ (lobo's TEST pair), ssl_dhparam -> certs/dhparam.pem (Zulip's published ffdhe2048, Apache-2.0); nothing stripped
# lobo-corpus: oracle-exit=1 lobo-exit=1 delta=both refuse — pinned: unknown directive "return" in conf.d/site.conf:15; lobo: unknown directive "ssl" (did you mean "set"?) in conf.d/site.conf:21; stock says: unknown directive "ssl" in conf.d/site.conf:21

user  nginx;
worker_processes  auto;

error_log  logs/error.log notice;
pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    include conf.d/*.conf;
}
