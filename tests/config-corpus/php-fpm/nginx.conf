# wws-corpus: source=synthetic (the fastcgi/php-fpm shape from nginx docs + distro fastcgi snippets; parse-only at ws01) license=n/a-synthetic
# wws-corpus: oracle-exit=1 wws-exit=0 delta=oracle-build: pinned oracle carries no PCRE, so the regex location fails there ("requires PCRE library", probe p43); stock nginx accepts this config
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    server {
        listen 8080;
        server_name php.example.org;
        root /srv/www/app/public;
        index index.php index.html;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
        }

        location ~ /\.ht {
            return 403;
        }
    }
}
