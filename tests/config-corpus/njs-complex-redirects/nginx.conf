# lobo-corpus: source=https://github.com/nginx/njs-examples/blob/d5de982e5f720f8aaaad9996080209195fee01b2/conf/http/complex_redirects.conf license=BSD-2-Clause
# lobo-corpus: edits=listen 80 -> 18080; js_path /etc/nginx/njs/ -> njs/ (prefix-relative; the .js modules are not carried — the config is refused before they are read); nothing stripped
# lobo-corpus: oracle-exit=1 lobo-exit=1 delta=both refuse — pinned: dlopen() "modules/ngx_http_js_module.so" failed (modules/ngx_http_js_module.so: cannot open shared object file: No such file or directory) in nginx.conf:4; lobo: unknown directive "load_module" in nginx.conf:4; stock says: dlopen() "modules/ngx_http_js_module.so" failed (modules/ngx_http_js_module.so: cannot open shared object file: No such file or directory) in nginx.conf:4
load_module modules/ngx_http_js_module.so;

events {  }

http {
    js_path "njs/";

    js_import utils.js;
    js_import main from http/complex_redirects.js;

    upstream backend {
        server 127.0.0.1:8080;
    }

    server {
        listen 18080;

        location = /version {
            js_content utils.version;
        }

        # PROXY

        location / {
            auth_request /resolv;
            auth_request_set $route $sent_http_route;

            proxy_pass http://backend$route$is_args$args;
        }

        location = /resolv {
            internal;

            js_content main.resolv;
        }

        # EXTERNAL RESOLVER
        # location = /resolv {
        #    internal;
        #
        #    proxy_pass $RESOLVER_URI;
        #    proxy_pass_request_body off;
        #    proxy_set_header Content-Length "";
        #    proxy_set_header X-Original-URI $request_uri;
        # }
    }

    # BACKEND

    server {
        listen 8080;

        location / {
            return 200 "$request_uri";
        }

    }

    # RESOLVER

    server {
        listen 8090;

        # allow xxx;
        # deny  all;

        location = /map {
            js_content main.map;
        }

        location = /add {
            js_content main.add;
        }

        location = /remove {
            js_content main.remove;
        }

    }
}
