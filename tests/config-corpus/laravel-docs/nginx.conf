# lobo-corpus: source=https://github.com/laravel/docs/blob/eff8739e9090c2a0216fefac8e33dacdd689f8f6/deployment.md (the fenced nginx block under Server Configuration), as conf.d/site.conf, wrapped in nginx/pkg-oss's packaged nginx.conf (BSD-2-Clause, d16a981d5921b9d27985a24998d3438fb73bb1d7) license=MIT
# lobo-corpus: edits=listen privileged N -> 18000+N; wrapper paths prefix-relative, logs -> logs/, pid -> logs/nginx.pid; fastcgi_params is nginx-1.30.4's; nothing stripped
# lobo-corpus: oracle-exit=1 lobo-exit=1 delta=both refuse — pinned: using regex "^/index\.php(/|$)" requires PCRE library in conf.d/site.conf:23; lobo: unknown directive "log_not_found" in conf.d/site.conf:18; stock loads

user  nginx;
worker_processes  auto;

error_log  logs/error.log notice;
pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    include conf.d/*.conf;
}
