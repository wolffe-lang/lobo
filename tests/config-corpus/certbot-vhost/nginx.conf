# lobo-corpus: source=synthetic (the certbot-managed vhost shape: HTTP-01 webroot location + the ssl_certificate pair certbot writes; parse-clean here is the W4 compat story. ws05: the pair is REAL — a TEST Ed25519 chain under live/<domain>/ in the certbot layout, relative to the prefix, so lobo -t exercises the whole load+pair-match path; the /etc/letsencrypt absolute paths became prefix-relative for hermeticity, same layout) license=n/a-synthetic
# lobo-corpus: oracle-exit=1 lobo-exit=1 (both refuse since ws47, lobo#38: nginx -t opens `ssl_dhparam` for a server with a certificate and refuses the absent /etc/letsencrypt/ssl-dhparams.pem with BIO_new_file failed, measured on a stock 1.30.4 by ws40 and on the pinned and stock builds by ws47; lobo now opens and reads it too. The pinned build fails earlier on `return` (probe p62). Before ws40 this line said "stock nginx accepts this config", which was never measured and is false; ws40 to ws46 carried it as lobo-lenient)
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;

    server {
        listen 80;
        server_name www.example.org;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name www.example.org;

        ssl_certificate live/example.org/fullchain.pem;
        ssl_certificate_key live/example.org/privkey.pem;
        include options-ssl.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        root /srv/www/site;
        index index.html;
    }
}
