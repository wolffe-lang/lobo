# lobo-corpus: source=synthetic (the certbot-managed vhost shape: HTTP-01 webroot location + the ssl_certificate pair certbot writes; parse-clean here is the W4 compat story. ws05: the pair is REAL — a TEST Ed25519 chain under live/<domain>/ in the certbot layout, relative to the prefix, so lobo -t exercises the whole load+pair-match path; the /etc/letsencrypt absolute paths became prefix-relative for hermeticity, same layout) license=n/a-synthetic
# lobo-corpus: oracle-exit=1 lobo-exit=0 delta=lobo-lenient: nginx refuses this config on EVERY build, not only the pinned one — ws40 measured a stock 1.30.4 (rewrite + PCRE + ssl) refusing it with BIO_new_file("/etc/letsencrypt/ssl-dhparams.pem") failed: `ssl_dhparam` is absolute and absent, and nginx -t opens it; lobo parses `ssl_dhparam` (planned row) and never opens the file. The pinned build fails earlier on `return` (probe p62). Before ws40 this line said "stock nginx accepts this config", which was not measured and is false
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;

    server {
        listen 80;
        server_name www.example.org;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name www.example.org;

        ssl_certificate live/example.org/fullchain.pem;
        ssl_certificate_key live/example.org/privkey.pem;
        include options-ssl.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        root /srv/www/site;
        index index.html;
    }
}
