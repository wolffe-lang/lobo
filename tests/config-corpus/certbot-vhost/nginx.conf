# wws-corpus: source=synthetic (the certbot-managed vhost shape: HTTP-01 webroot location + the ssl_certificate pair certbot writes; parse-clean here is the W4 compat story. ws05: the pair is REAL — a TEST Ed25519 chain under live/<domain>/ in the certbot layout, relative to the prefix, so wws -t exercises the whole load+pair-match path; the /etc/letsencrypt absolute paths became prefix-relative for hermeticity, same layout) license=n/a-synthetic
# wws-corpus: oracle-exit=1 wws-exit=0 delta=oracle-build: pinned oracle has no http_ssl_module and no rewrite module, so `return`/`ssl_certificate` are unknown there (probes p60/p62); stock nginx accepts this config
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;

    server {
        listen 80;
        server_name www.example.org;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name www.example.org;

        ssl_certificate live/example.org/fullchain.pem;
        ssl_certificate_key live/example.org/privkey.pem;
        include options-ssl.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        root /srv/www/site;
        index index.html;
    }
}
