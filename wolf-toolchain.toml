#     out. TWO NEW BUILTINS (consumed by ws24: the plaintext small-file
#     arm gathers head and body; `tcp_nodelay` is served) and ONE
#     BEHAVIORAL DEFAULT (Nagle off on every accepted stream — the
#     posture nginx's `tcp_nodelay on` takes; the linux delayed-ACK
