# The pinned toolchain wws is true for (ws00, target 4). The idiom is
# wolf-book's `wolf-toolchain.toml` (repo + rev, CI fetches by commit
# hash and builds), with wolf-std's binary-resolution order for local
# runs: $WOLF_BIN / $LUPIN_BIN → .wolf-bin/ → PATH. `tools/wws-gauntlet`
# verifies identity before anything else and refuses on drift.
#
# Identity is read from the FIRST line of `--version` only (the
# wolf-std F-0064 lesson): `wolf` names no sha of its own — its second
# line names its lupin PAIRING, which is reported, never gated — and
# lupin's line names its wolf-lang conformance pin, which is
# information, not this file's rev.
#
# Bumps are deliberate: their own commit, gauntlet green at the new
# pin, this note updated with what the bump changes for wws.

[wolf]
# wolf-lang at the **v0.2.9 RELEASE TAG** (4c60946, "three things a
# reader ran into this week" — the r12 train: s143 (#265 the `parse`
# row, #268 every value renders in a hole, #270 the per-file IR
# ratchet), s144 (#276 a leading `else`, #273 `closed`/`cancelled`,
# #274 `pop` answers `none`), s145 (#278 `str + char`, #268 closure
# `return`)). ws27 pinned it the day after the tag landed, so the
# ws18/ws24 dev-stamped-trunk shape was not needed. D57: built AT the
# tag the driver claims the bare version, no +dev suffix. Build in a
# scratch worktree at the tag with `cargo xtask dist` — the dist
# build is the stamped one (WOLF_COMMIT from HEAD's short sha,
# WOLF_RELEASE granted only when the exact tag points at HEAD; a plain
# `cargo build` prints `+dev.unknown` and lib-toolchain.sh refuses it):
#   git worktree add <scratch> v0.2.9
#   (cd <scratch> && cargo xtask dist)
# and stage target/dist/wolf-0.2.9-<host>/{wolf, libwolf_rt.a} into
# .wolf-bin/ — the native tier needs the staticlib beside the driver.
# ci.yml builds the same stamp by hand (WOLF_RELEASE from the tag at
# HEAD, WOLF_COMMIT the rev below cut to seven).
#
# 5c729e8 (v0.2.8) → 4c60946 (v0.2.9) is fifty-one commits over one
# train. What the bump brings this repo, each classed at the bump and
# measured after it (the ws27 CHANGELOG entry carries the numbers):
#   * s143 — `str.to_int()`'s row is spelled **`parse`**, not
#     `NotAnInt` ([mem.str.parse]): the ONE source-breaking change in
#     0.2.9, refused by name. ZERO HERE: lobo never calls `to_int`, no
#     `NotAnInt` arm exists in src/ or tests/, none in the pinned std
#     tree (grepped at the bump). `{x}` renders every value both
#     machines can show ([type.interp.*]) and refuses the rest by
#     name; `channel[T]` in a signature position types as a channel.
#     ADDITIVE — every hole lobo writes is a primitive or a str.
#   * s144 — a line whose first token is `else` continues the previous
#     statement (E0005 retired; `wolf fmt` is unchanged, so canonical
#     source does not move and lobo has no leading `else`, grepped);
#     `[conc.chan.close]` spells `closed`/`cancelled` (lobo's `closed`
#     rows are the net tier's and were lowercase already);
#     `[mem.list.pop]` says `pop` on an empty list is `none`, never a
#     fault (lobo's one `pop`, `http.lu`'s segment stack, takes the
#     row with an `else`). GRAMMAR-WIDENING and SPEC-SAYS-WHAT-THE-
#     COMPILER-DID; zero source motion.
#   * s145 — `str + char`, `char + str` and `s += c` are
#     interpolation-append (the int rows keep E0409); `return` inside
#     a CLOSURE returns from the closure, typed against its own result
#     (both lowering tiers already ran it so; sema's NotYet retires).
#     ZERO HERE: lobo is spawn-free (D7) and has no closure body — its
#     `else |e| { return … }` blocks are the defaulting operator
#     ([gram.amb.else]), whose `return` was and is the enclosing
#     function's — and it appends chars through holes, never `+`.
#   * runtime motion, all of it: `str.rs` (the char-append path
#     interpolation already had) and `task/conc_abi.rs` (a proc's int
#     result rides its exit reason). Neither is on the serving path.
#     BEHAVIORAL-COST: none predicted.
#   * r12 — v0.2.9 itself, the CHANGELOG, the README's vendored mark.
#     MECHANICAL: the `.wolfi` toolchain stamp reads the VERSION —
#     0.2.8 → 0.2.9 in every header, the export/pkg hashes re-derived.
# Source motion in lobo for the pin's own sake: the `.wolfi` stamp and
# the two shell.lu constants; predicted ZERO item lines, and the
# ws27 entry says what was measured.
# Pairing note (F-0064, reported never gated): wolf@v0.2.9 declares
# lupin **0.1.29** as its pairing and [lupin] below names 0.1.29 —
# THE PAIRING GAP IS ZERO (0.1.30, is42's leading-`else` mirror,
# exists and is not the pairing). THE LANE GAP, named: 0.1.29's
# conformance pin is e9a17cb (past v0.2.8 — s141's `net_writev`/
# `net_nodelay` are in its builtin table now) but it does not name
# `fs_fstat` (grepped), so the static small-file arm is still native-
# only; lupin resolves a builtin at the CALL (probed at ws24), no
# lupin-lane test drives that arm, and the corpus at the bump is the
# measurement.
# The #146 WOLF_MIDEND caveat: re-probed at THIS pin, SIXTEENTH
# measurement — see the ws27 CHANGELOG entry for the state read at the
# bump; the gauntlet's release step and the release archive's build
# keep WOLF_MIDEND=0 until the fix enters the [wolf] pin. See [std]'s
# note. The shipped binary is the gauntlet's release-tier build, flag
# for flag.
repo = "wolffe-lang/wolf-lang"
rev = "4c60946081e1d1e65dd4b3d98cd69ac86bdf1d38"
version_line = "wolf 0.2.9 (wolfgang, pin 4c60946)"

