#
#   * The upstream release note is TWO FILES LIGHT for this repo, and
#     the error is systematic, not local. v0.2.12's notes record
#     "lobo `1148318` 28 files (71 to 0, 8 to 0)" — measured at THIS
#     repo's exact trunk sha, off a branch build. The released binary
#     moves 30 over that same sha. wolf-std logged the identical
#     delta in the same span (F-0124: 33 predicted on a branch build,
#     35 measured with the release binary, twice, by two independent
#     walks). Same span, same sign, same magnitude. Filed upstream.
