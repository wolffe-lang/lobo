# The pinned toolchain wws is true for (ws00, target 4). The idiom is
# wolf-book's `wolf-toolchain.toml` (repo + rev, CI fetches by commit
# hash and builds), with wolf-std's binary-resolution order for local
# runs: $WOLF_BIN / $LUPIN_BIN → .wolf-bin/ → PATH. `tools/wws-gauntlet`
# verifies identity before anything else and refuses on drift.
#
# Identity is read from the FIRST line of `--version` only (the
# wolf-std F-0064 lesson): `wolf` names no sha of its own — its second
# line names its lupin PAIRING, which is reported, never gated — and
# lupin's line names its wolf-lang conformance pin, which is
# information, not this file's rev.
#
# Bumps are deliberate: their own commit, gauntlet green at the new
# pin, this note updated with what the bump changes for wws.

[wolf]
# wolf-lang at the v0.2.2 RELEASE TAG (8cda3aa — "the learners'
# release", tagged 2026-09-02) — THE BARE STAMP AT LAST. ws12 ran
# trunk in the D57 dev-stamp shape because s131's region query
# post-dated v0.2.1; s132 (the cap half of #187, D68's fault ruling)
# merged BEFORE this tag, so the tag build carries everything lobo
# needs and `--version` claims `0.2.2` with no +dev suffix — the
# first time since wsm03 the [wolf] pin names a release, not a
# commit. Built AT THE TAG with the xtask dist stamp the builder
# computes (D33 bans build scripts): WOLF_COMMIT=8cda3aa
# WOLF_RELEASE=v0.2.2 — the release stamp is granted only when that
# exact tag points at HEAD, so a plain `cargo build` prints
# `+dev.unknown` and the identity check below refuses it
# (unverifiable is dev). What the bump brings this repo, each
# measured not assumed at the bump:
#   * s132 (D68, #187 closed) — THE SPRINT'S REASON: `region r(cap: n)`
#     bounds a region's ledger in the tier's own units
#     ([mem.region.cap.1-3]); a breach inside a proc is contained at
#     the boundary and reaches the join as `fault(alloc-contract)`
#     ([conc.proc.exit], `is_alloc_contract()`). ws13's cap adoption
#     is this clause set consumed: the ws10 meter becomes enforced by
#     the runtime.
#   * r05 letters — #206 (a bare entry name means `.`), #198
#     (STR_ESC derives escapes), #209 (a trap runs no defers at the
#     root — lupin divergence recorded for is34), #205 (the refusal
#     probes' flake retired). Blast radius on lobo measured at the
#     bump: zero (no lobo source moved; suite counts identical).
#   * s133 — the language server navigates (definition/references/
#     rename). Tooling, not codegen; nothing lobo builds changes.
#   * s60a — windows-native bring-up. lobo's serve loop leans on the
#     task layer and net deadlines, which that host refuses by name;
#     lobo stays Linux+macOS (docs/platforms.md is the ledger).
# The #146 WOLF_MIDEND caveat: re-probed at THIS pin, SIXTH
# measurement — still open (issue OPEN at the bump), the gauntlet's
# release step keeps WOLF_MIDEND=0. See [std]'s note.
# Pairing note (F-0064, reported never gated): wolf@v0.2.2 declares
# lupin 0.1.22 and the staged sibling IS 0.1.22 — the pairing agrees
# exactly, at a TAG on both sides for the first time.
# Build (in a scratch worktree at the tag):
#   git checkout v0.2.2
#   WOLF_COMMIT=8cda3aa WOLF_RELEASE=v0.2.2 \
#     cargo build --release -p wolf_driver -p wolf_rt
# and stage target/release/{wolf, libwolf_rt.a} into .wolf-bin/ —
# the native tier needs the staticlib beside the driver.
repo = "wolffe-lang/wolf-lang"
rev = "8cda3aa41004775bb4a4c0a600d7fb673143b7d0"
version_line = "wolf 0.2.2 (wolfgang, pin 8cda3aa)"

[lupin]
# lupin at the v0.1.22 RELEASE TAG (753d686; D57: build the tag, so
# --version claims the release with no +dev suffix). 0.1.22 is "the
# mirror holds" (is33): the region cap lands whole-pipe — `region
# r(cap: n)`, `trap(alloc-contract)` past the budget, and inside a
# proc the contained trap reaches the join as `fault(alloc-contract)`
# (the spelling was `error("trap", kind)` before, which made a crash
# answer `is_error()` true — is33 corrects it to `[conc.proc.exit]`'s
# closed set). That is exactly the surface ws13's cap adoption
# matches on, so the checked AND lupin lanes of the membudget suite
# run the same fault path the native tier does. Its conformance pin
# (2bfbe5e, the s132 merge — wolf-lang trunk's head when the release
# stepped, one commit before the v0.2.2 tag's own parent chain) is
# information, not this file's rev; the v0.2.2 CHANGELOG names
# 0.1.22 as ITS pairing, so the two tags name each other. Bumped
# together with [wolf] as always. Build AT THE TAG (scratch
# worktree):
#   git checkout v0.1.22 && cargo build --release --bin lupin
# stage target/release/lupin into .wolf-bin/.
repo = "wolffe-lang/wolf-interp"
rev = "753d686b923859562a6dd443d2bfbba3c06db745"
version_line = "lupin 0.1.22 (wolf-interp, reference interpreter at pin 2bfbe5e)"
 [std]'s note.
[std]
# wolf-std, pinned at TRUNK a62a5d4 (the sc31 docs commit atop the
# sc31 merge) — THE BUMP THAT CARRIES `named` / `row_name`
# (wolf-std#3, sc31: `std.x.tls.client`'s whole 21-row refusal
# vocabulary as two thin faces over ONE match — `named(v)` rides the
# value through and coarsens a refusal to `Row(str)`; `row_name(v)`
# answers the row's own name, or the reserved `"ok"`). ws12 adopts
# them at lobo's two TLS-client error sites; `cert.validate_chain`'s
# nine rows ride in by width subtyping. The sc29 surface this repo
# already consumes (std.x.tls.client's two-phase begin/complete,
# caller-owned dial and trust anchors, verifying CertificateVerify) is
# unchanged — sc31's adoption is opt-in and moves no existing
# signature. NOT a binary: a SOURCE TREE the toolchain resolves
# `use std.…` against (`--std-root` / $WOLF_STD — the driver's own
# mechanism; lib-toolchain.sh exports it). Staged, like every pinned
# artifact, by a documented one-time action:
#   git -C <wolf-std-checkout> archive <rev> std | tar -x -C .wolf-bin/
#   git -C <wolf-std-checkout> rev-parse <rev> > .wolf-bin/std/STD-REV
# lib-toolchain.sh REFUSES when the tree is missing or STD-REV drifts
# from `rev` (a tree has no --version; the marker is its identity).
# PIN AGREEMENT at the ws13 bump (measured, not assumed): wolf-std's
# own wolf pin at a62a5d4 is STILL 75fd2d0 (the v0.2.1 tag) and its
# lupin pin 0.1.20 — std's trunk has not moved since ws12 (a62a5d4 IS
# origin/trunk at the bump). This repo's [wolf] now runs ONE RELEASE
# ahead of std's (v0.2.2 vs v0.2.1) and its [lupin] two point
# releases ahead (0.1.22 vs 0.1.20); both forward-only, both named:
# s132's cap is the reason, and std has no sprint on it yet. The
# gauntlet's both-tiers build over the staged tree is the measurement
# that the a62a5d4 tree carries under the newer driver (sc31's
# surface is unchanged by any r05 letter — grep-checked at the bump:
# no `std/` file names a construct #206/#198/#209 moved).
# KNOWN CAVEAT at this pin pair: wolf-lang#146 (the loop-versioning
# noalias guard built from a non-dominating len load, sc_muladd) —
# re-probed at v0.2.2 at THIS bump (the SIXTH measurement, recorded
# in the ws13 CHANGELOG entry): the issue is OPEN and the gauntlet's
# release step keeps WOLF_MIDEND=0 until the fix enters the [wolf]
# pin; the flip-back rides that bump.
repo = "wolffe-lang/wolf-std"
rev = "a62a5d4248c391b3c26d51195ed5cfd69732b9ce"
