# The pinned toolchain wws is true for (ws00, target 4). The idiom is
# wolf-book's `wolf-toolchain.toml` (repo + rev, CI fetches by commit
# hash and builds), with wolf-std's binary-resolution order for local
# runs: $WOLF_BIN / $LUPIN_BIN → .wolf-bin/ → PATH. `tools/wws-gauntlet`
# verifies identity before anything else and refuses on drift.
#
# Identity is read from the FIRST line of `--version` only (the
# wolf-std F-0064 lesson): `wolf` names no sha of its own — its second
# line names its lupin PAIRING, which is reported, never gated — and
# lupin's line names its wolf-lang conformance pin, which is
# information, not this file's rev.
#
# Bumps are deliberate: their own commit, gauntlet green at the new
# pin, this note updated with what the bump changes for wws.

[wolf]
# wolf-lang trunk at the s119 merge (the wsm02 bump, from 64a38f3 /
# s115). What the bump brings wws — the three named retirements:
# s118 os_random(n) (OS CSPRNG: getrandom/getentropy/BCryptGenRandom;
# failure TRAPS, no fallback, no error row — ws05's interim
# HKDF-derived TLS randomness retires, wolf-lang#143 / D19), s119's
# #142 fix (rangeopt's stale-CFG dominance bug + the token-linearity
# verifier refined to edge-target — the release WOLF_MIDEND=0
# workaround retires, D18), and s119's #144 fix (List element stride
# rounds up to the element's alignment — the bool-mixing connection
# struct tiles, TLS joins the ws08 drain table, D20). Wolf-lang trunk
# at wsm02 launch IS this commit, so pin == trunk == the contract's
# named target. Build:
#   cargo build --release -p wolf_driver -p wolf_rt
# and stage target/release/{wolf, libwolf_rt.a} into .wolf-bin/ —
# the native tier needs the staticlib beside the driver.
repo = "wolffe-lang/wolf-lang"
rev = "53f6191ff3821ede1df6a0a18fc3fd6a079ad5bf"
version_line = "wolf 0.1.0 (wolfgang)"

[lupin]
# wolf-interp trunk at the is24 merge: the #44 lint fix — a
# tag-shaped match arm resolves as the TAG, not a fresh binding, so
# W0305 no longer false-fires on a same-tag re-raise
# (`refused => return refused`). The wsm01 sentinel-code reshapes in
# rig/shell/proxy revert on this bump (ledger row D17). Bumped
# together with [wolf] as always. Build:
#   cargo build --release --bin lupin
# and stage target/release/lupin into .wolf-bin/.
repo = "wolffe-lang/wolf-interp"
rev = "7b1363857567c6d46bd2ca6ef3873cb89388960b"
version_line = "lupin 0.1.13 (wolf-interp, reference interpreter at pin 90c90df)"

[std]
# wolf-std, pinned at the sc22 merge — the first std consumption in
# this repo (ws05's TLS gate: std.x.tls.{record,handshake,cert} and
# the std.x.crypto ladder under them). NOT a binary: a SOURCE TREE the
# toolchain resolves `use std.…` against (`--std-root` / $WOLF_STD —
# the driver's own mechanism; lib-toolchain.sh exports it). Staged,
# like every pinned artifact, by a documented one-time action:
#   git -C <wolf-std-checkout> archive <rev> std | tar -x -C .wolf-bin/
#   git -C <wolf-std-checkout> rev-parse <rev> > .wolf-bin/std/STD-REV
# lib-toolchain.sh REFUSES when the tree is missing or STD-REV drifts
# from `rev` (a tree has no --version; the marker is its identity).
# What the pin brings wws: sc20 record layer (RFC 8448-gated), sc21
# handshake (frozen HandshakeResult seam), sc22 X.509/Ed25519 chain
# validation (frozen validate_chain seam), sc16/17/18 digests/AEAD/
# curves beneath them. wolf-std's own wolf pin (21b129e, s111) is an
# ANCESTOR of this repo's (64a38f3, s115) — forward drift, verified by
# probe at staging (the record/handshake/curve modules compile and run
# natively here). KNOWN CAVEAT at this pin pair: the RELEASE tier's
# mid-end still ICEs on std.x.crypto.curve25519 — #142 (sc_reduce) is
# FIXED at the s119 pin, and a survivor of the same dominance class
# ICEs in sc_muladd from a different site (the loop-versioning
# noalias guard builds from a non-dominating len load) — wolf-lang#146,
# filed from wsm02 with a std-free reproducer. The gauntlet's release
# step keeps WOLF_MIDEND=0 until the #146 fix enters the [wolf] pin;
# the flip-back rides that bump.
repo = "wolffe-lang/wolf-std"
rev = "b326f09fc34dc4c388d7688ba68322bf9bea0a9a"
