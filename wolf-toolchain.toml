#     their fix; that is a second pass, not this one". THAT WAS WRONG:
#     #339's fix is e47567b, inside this tag. The second pass IS this
#     pass, and #339 — not #303 — is what moved the tree.
#     MEASURED with the RELEASE binary over src/ + tests/ (149 .lu):
#     **30 files re-lay**. Exactly one of them, src/main.lu, carries
#     #303 chain motion (the three mixed-shape chains lobo#16
#     tabulated, at 1377/1385/3018); the other 29 are #339's, almost
#     all the orphaned receiver-dot break rejoining. #314: zero — this
