# The pinned toolchain wws is true for (ws00, target 4). The idiom is
# wolf-book's `wolf-toolchain.toml` (repo + rev, CI fetches by commit
# hash and builds), with wolf-std's binary-resolution order for local
# runs: $WOLF_BIN / $LUPIN_BIN → .wolf-bin/ → PATH. `tools/wws-gauntlet`
# verifies identity before anything else and refuses on drift.
#
# Identity is read from the FIRST line of `--version` only (the
# wolf-std F-0064 lesson): `wolf` names no sha of its own — its second
# line names its lupin PAIRING, which is reported, never gated — and
# lupin's line names its wolf-lang conformance pin, which is
# information, not this file's rev.
#
# Bumps are deliberate: their own commit, gauntlet green at the new
# pin, this note updated with what the bump changes for wws.

[wolf]
# wolf-lang trunk at wsm04 acquisition (post-s130; the wsm04 bump,
# from addcd7f / post-s127). The v0.2.1 tag did NOT exist at
# acquisition (checked `git fetch --tags && git tag -l` — r04 had not
# shipped), so this is the D57 DEV-STAMP shape sc30 recorded: built
# with WOLF_COMMIT=b80d239 (the xtask dist stamp, computed by the
# builder — D33 bans build scripts), so `--version` claims
# `0.2.0+dev.b80d239` and the binary's own pin clause agrees with this
# rev by construction. A PLAIN `cargo build` is unstamped and prints
# `+dev.unknown` — the identity check below refuses it (unverifiable
# is dev). What the bump brings this repo, each measured not assumed
# at the bump: s128 (v0.2.0 release machinery), s129 (#184 lend-slice
# mem fix; struct patterns whole-pipe), s130 (match arms take the
# product domain, c06 retired; a mid-end bool-fold ICE fixed) —
# s129/s130 are patterns and arms, expected invisible to lobo's
# corpus (verified at the bump; deltas classed per sc26). The #146
# WOLF_MIDEND caveat: re-probed at THIS pin — see [std]'s note.
# Pairing note (F-0064, reported never gated): wolf@b80d239 declares
# lupin 0.1.18 while the staged sibling is 0.1.19 — advance notice.
# Build (in a scratch clone at the rev):
#   WOLF_COMMIT=b80d239 cargo build --release -p wolf_driver -p wolf_rt
# and stage target/release/{wolf, libwolf_rt.a} into .wolf-bin/ —
# the native tier needs the staticlib beside the driver.
repo = "wolffe-lang/wolf-lang"
rev = "b80d239e2d1edf5d767108f8c01b98a7709bf35d"
version_line = "wolf 0.2.0+dev.b80d239 (wolfgang, pin b80d239)"

[lupin]
# lupin at the v0.1.19 RELEASE TAG (D57: build the tag, so --version
# claims the release with no +dev suffix; is31's v0.1.20 had NOT
# shipped at wsm04 acquisition — checked `git tag -l` after fetch,
# the contract's named fallback taken). 0.1.19 carries is29-is30; the
# load-bearing change for this repo is is30's net byte tier
# (net_read_bytes/net_write_bytes resolve under lupin — F-0102
# closed), which is what lets std.x.tls.client's loopback handshake
# RUN on the lupin lane (sc30 measured 18.9s inside the 50M step
# budget). Its conformance pin (83f83bb, one merge behind [wolf]'s
# b80d239 — the s130 span) is information, not this file's rev.
# Bumped together with [wolf] as always. Build AT THE TAG (scratch
# clone):
#   git checkout v0.1.19 && cargo build --release --bin lupin
# stage target/release/lupin into .wolf-bin/.
repo = "wolffe-lang/wolf-interp"
rev = "23dcf62676826e6ca1cebea2351b8140de53a4d0"
version_line = "lupin 0.1.19 (wolf-interp, reference interpreter at pin 83f83bb)"

[std]
# wolf-std, pinned at TRUNK 26f0588 (the sc30 docs commit atop the
# sc29/sc30 merges) — THE BUMP THAT CARRIES std.x.tls.client (sc29:
# the TLS 1.3 client state machine over the record/handshake/cert
# halves this repo already consumes — two-phase begin/complete,
# caller-owned dial and trust anchors, CertificateVerify VERIFIES for
# ed25519/ecdsa-p256) plus sc30's pins (loopback_handshake measured
# running under lupin 0.1.19). This is the pin wsm04's D21/D25
# retirements consume: `proxy_pass https://` and https `cert_ca` both
# ride std.x.tls.client. NOT a binary: a SOURCE TREE the toolchain
# resolves `use std.…` against (`--std-root` / $WOLF_STD — the
# driver's own mechanism; lib-toolchain.sh exports it). Staged, like
# every pinned artifact, by a documented one-time action:
#   git -C <wolf-std-checkout> archive <rev> std | tar -x -C .wolf-bin/
#   git -C <wolf-std-checkout> rev-parse <rev> > .wolf-bin/std/STD-REV
# lib-toolchain.sh REFUSES when the tree is missing or STD-REV drifts
# from `rev` (a tree has no --version; the marker is its identity).
# wolf-std's own wolf pin at 26f0588 IS b80d239 — this repo's [wolf]
# pin and std's agree exactly at this bump (no forward drift for the
# first time; verified at staging).
# KNOWN CAVEAT at this pin pair: wolf-lang#146 (the loop-versioning
# noalias guard built from a non-dominating len load, sc_muladd) —
# re-probed at b80d239 at THIS bump (the fourth measurement, recorded
# in the wsm04 closeout): the gauntlet's release step keeps
# WOLF_MIDEND=0 until the fix enters the [wolf] pin; the flip-back
# rides that bump.
repo = "wolffe-lang/wolf-std"
rev = "26f0588f748b6e658dc4bebf2dac35ce71fd6f0a"
