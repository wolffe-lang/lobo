# The pinned toolchain wws is true for (ws00, target 4). The idiom is
# wolf-book's `wolf-toolchain.toml` (repo + rev, CI fetches by commit
# hash and builds), with wolf-std's binary-resolution order for local
# runs: $WOLF_BIN / $LUPIN_BIN → .wolf-bin/ → PATH. `tools/wws-gauntlet`
# verifies identity before anything else and refuses on drift.
#
# Identity is read from the FIRST line of `--version` only (the
# wolf-std F-0064 lesson): `wolf` names no sha of its own — its second
# line names its lupin PAIRING, which is reported, never gated — and
# lupin's line names its wolf-lang conformance pin, which is
# information, not this file's rev.
#
# Bumps are deliberate: their own commit, gauntlet green at the new
# pin, this note updated with what the bump changes for wws.

[wolf]
# wolf-lang at TRUNK **fc07cc5** (s149 merged: "bench: fold the two
# s149 witnesses into the IR-volume record"), dev-stamped
# `0.2.10+dev.fc07cc5` — v0.2.10 is tagged 62 commits behind it and
# s149 is the reason for this pin (ws30), so the ws18/ws24 dev-
# stamped-trunk shape is taken again; the next release tag re-pins the
# way ws25 re-pinned bd7caff → v0.2.8. D57: built off the tag the
# driver claims `+dev.<short sha>`. Build in a scratch worktree at the
# sha with `cargo xtask dist` — the dist build is the stamped one
# (WOLF_COMMIT from HEAD's short sha; WOLF_RELEASE is NOT granted, no
# tag points here; a plain `cargo build` prints `+dev.unknown` and
# lib-toolchain.sh refuses it):
#   git worktree add <scratch> fc07cc5
#   (cd <scratch> && cargo xtask dist)
# and stage target/dist/wolf-0.2.10-<host>/{wolf, libwolf_rt.a} into
# .wolf-bin/ — the archive is NAMED 0.2.10 (xtask names the dist by
# the cargo version), the binary inside says `+dev.fc07cc5`. ci.yml
# builds the same stamp by hand (WOLF_COMMIT the rev below cut to
# seven; no WOLF_RELEASE, since no tag points at the rev).
#
# 4c60946 (v0.2.9) → fc07cc5 is sixty-two commits: the r13/r14/r15
# train (v0.2.10), s146–s149, #281, #292, #301, #304. What the bump
# brings this repo, each classed at the bump and measured after it
# (the ws30 CHANGELOG entry carries the numbers):
#   * s149 — **THE REASON.** `[os.fs.open]` mode **5**: a read open
#     carrying `O_NONBLOCK`, so a fifo or device answers a handle at
#     once and `fs_fstat` classifies it `kind` 2 (wolf-lang#289); and
#     the accept posture, `accept4(SOCK_NONBLOCK|SOCK_CLOEXEC)` where
#     linux has it with `TCP_NODELAY` paid at the first write Nagle
#     could hold back, not at every accept (wolf-lang#290). SOURCE
#     MOTION, predicted ONE router site: `serve.classify` replaces
#     `is_file_warm`'s path stat + `serve_file`'s open with one open
#     and one fstat, and ws27's kind table loses its kind half; the
#     dry-run's `stat_note` mirrors it. BEHAVIORAL-COST, predicted in
#     docs/PROFILE.md's ws30 addendum BEFORE the pin was staged: close
#     shape −2.00 syscalls per connection (`ioctl` + `setsockopt`),
#     keepalive 0.00 (the kind table had already taken the stat's
#     unit at ws27); what the keepalive shape gains is the window —
#     no second in which a swap for a fifo can park a hand. On macOS
#     the accept side goes 4 → 3 (no `accept4`; the `setsockopt`
#     leaves), per #290's own measurement.
#   * s148 — #292: the `.wolfi` export/pkg hashes are over the
#     INTERFACE now, not the release string. MECHANICAL, and the last
#     time a toolchain bump moves every hash: this re-record moves
#     them once under the content-only rule, and the next pin moves
#     only the header stamp. #293: `s[a..b] = …` is E0416 (a str is
#     immutable; a slice is not a place). REFUSED-BY-NAME class, ZERO
#     HERE: no slice or index assignment on a str anywhere in src/ or
#     tests/ (grepped at the bump). #284: `[type.fn.ret]` and
#     `[type.row.operand]` say what both machines already did; no
#     behaviour moves.
#   * s147 — range arms in `match` (`[gram.pat.range]`). GRAMMAR-
#     WIDENING; lobo's matches are literals and tags; zero motion.
#   * s146 — `[type.unit.context]`/`[type.unit.discard]`: a `!()` tail
#     in a unit context is a DISCARD, warned W0601, never a mismatch;
#     `chan.send` is typed with its row. ZERO HERE on the channel half
#     (lobo has no channel — grepped); the W0601 half is MEASURED by
#     the gauntlet, which denies warnings on every lane: the corpus at
#     the bump is the number.
#   * #301 — the stamp's commit is seven characters by decision; this
#     file's `pin fc07cc5` was already that shape. MECHANICAL.
#   * r14/r15 — v0.2.10, the CHANGELOG, the pairing taking lupin
#     0.1.30 then 0.1.31 (#304 — the control ritual finds its blind
#     spot). MECHANICAL here: the `.wolfi` toolchain stamp reads the
#     VERSION, not the dev suffix — 0.2.9 → 0.2.10 in every header.
# Source motion in lobo for the pin's own sake: the `.wolfi` stamp and
