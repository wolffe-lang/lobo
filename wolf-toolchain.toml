# (the whole archive pair — the driver, the runtime staticlib it
# links, the cimport worker beside it).
#
# WHAT THE BUMP BRINGS THIS REPO, measured at ws34 rather than assumed.
#
#   * THE FORMATTER, and it is the whole of the source motion. FOUR
#     fmt commits ride this span, not the one lobo#16 named:
#       0c47664  #303  a braced `if` chain breaks as one
