# The pinned toolchain wws is true for (ws00, target 4). The idiom is
# wolf-book's `wolf-toolchain.toml` (repo + rev, CI fetches by commit
# hash and builds), with wolf-std's binary-resolution order for local
# runs: $WOLF_BIN / $LUPIN_BIN → .wolf-bin/ → PATH. `tools/wws-gauntlet`
# verifies identity before anything else and refuses on drift.
#
# Identity is read from the FIRST line of `--version` only (the
# wolf-std F-0064 lesson): `wolf` names no sha of its own — its second
# line names its lupin PAIRING, which is reported, never gated — and
# lupin's line names its wolf-lang conformance pin, which is
# information, not this file's rev.
#
# Bumps are deliberate: their own commit, gauntlet green at the new
# pin, this note updated with what the bump changes for wws.

[wolf]
# wolf-lang at the **v0.2.8 RELEASE TAG** (5c729e8, "the syscall goes
# first" — s141 (#257, #254) and s142 (#263 `str.to_int`, #261
# `fs_fstat`) on the r11 train). ws24 pinned the dev-stamped trunk sha
# bd7caff first (r11 had not tagged when the sprint reached its pin
# step; the contract's either/or, the ws18 shape) and RE-PINNED here
# the same day the tag landed. D57: built AT the tag the driver claims
# the bare version, no +dev suffix. Build in a scratch worktree at the
# tag with the release stamp (xtask's own rule: granted only when that
# exact tag points at HEAD, `build_is_release`):
#   git worktree add <scratch> v0.2.8
#   WOLF_RELEASE=v0.2.8 WOLF_COMMIT=5c729e8 \
#     cargo build --release -p wolf_driver -p wolf_rt
# and stage target/release/{wolf, libwolf_rt.a} into .wolf-bin/ — the
# native tier needs the staticlib beside the driver. ci.yml stages
# exactly this (the tag at HEAD grants the release stamp).
#
# 398e5f5 (v0.2.6) → bd7caff → 5c729e8 is fifty-four commits over four
# trains. What the bump brings this repo, each classed at the bump and
# measured after it (the ws24 CHANGELOG entry carries the numbers):
#   * s141 — **wolf-lang#257 CLOSES** (`[os.net.io]`, the syscall goes
#     first): every parking net call tries the syscall before it waits
#     and parks on WouldBlock only, against the budget computed at
#     entry. The rows are unchanged; the COST moves (ws22's profile:
#     ~30 of 63 µs per keepalive request was the pre-syscall park).
#     BEHAVIORAL-COST-ONLY. Measured at ws24: linux N=4 keepalive
#     3.178x → 1.862x, close 1.981x → 1.300x (VALID sets); macOS N=1
#     keepalive 46 → 23 µs/request (indicative).
#   * s141 — **wolf-lang#254 CLOSES** (`[os.net.writev]`,
#     `[os.net.nodelay]`): `net_writev(fd, List[List[byte]]) -> () !
#     {closed, io}` and `net_nodelay(fd, bool) -> () ! {io}`, and
