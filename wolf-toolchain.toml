[std]
# wolf-std, pinned at TRUNK bd12ef5 (the sc37 docs commit atop the sc37
# merge, "the words come true"): the bump that ANSWERS wolf-std#6.
# `std.net.listen_with(addr, opts)` / `std.net.adopt_listener(fd)` /
# `std.net.wait(fds, deadline_ms)` and a new `std.os.cpus()` now exist,
# both acquisition calls answering the ORDINARY `Listener`.
# **THE DECISION, taken deliberately at ws18 and not by default: lobo's
# serving loop STAYS ON THE BUILTINS at this pin, and the reason is the
# loop's own shape, not inertia.** Three facts, each checked against
# the source rather than assumed:
#   1. The loop is RAW-FD end to end. `net_wait` multiplexes ONE
#      `List[int]` holding the control listener, both http listeners
#      and every open connection, and the connection table is parallel
#      `List`s indexed by position; `net_accept`/`net_read`/
#      `net_write`/`net_deadline`/`net_close` all take that int.
#      `std.net`'s tier is typed (`Listener`/`Socket`), and `wait`
#      takes `List[int]` regardless — so a Listener would be built and
#      immediately unwrapped through `.fd` to enter the same set.
#   2. The inherit PAIR would split across tiers. sc37 wrapped the
#      acquisition half only; `os_spawn_with` is deliberately not
#      wrapped (std.process's `Command` question is unanswered), so a
#      master would spawn through the BUILTIN and its hand would adopt
#      through STD — two tiers for one handshake, which is worse to
#      read than one.
#   3. Nothing behavioral is on offer. Every one of the four is a pure
#      delegate; moving would buy a spelling.
# So the posture is UNIFORM and stated: the many-hands listener path,
# the readiness wait and the cpu count all call the builtins, exactly
# as the rest of the loop does. What WOULD move it is a sprint that
# adopts `std.net`'s types through the whole serving loop — routed as
# residue, not smuggled into a pin bump. lobo's preference on
# `os_spawn_with`'s std shape is posted on wolf-std#6, which sc37 asked
# for by name.
# c0f75e8 → bd12ef5 also carries sc37's wolf-side bump (982f857 →
# 6ade878, all three std pins on one sha), the ten byte-domain ledger
# rows coming true, API-CONVENTIONS §14's amendments, and F-0110: every
# one of the six new rows is `lupin = "unsupported"` because lupin
# 0.1.26 conforms to v0.2.4 — a CALENDAR, not a semantics, and the same
# lane gap [wolf] names.
# NOT a binary: a SOURCE TREE the toolchain resolves `use std.…`
# against (`--std-root` / $WOLF_STD — the driver's own mechanism;
# lib-toolchain.sh exports it). Staged, like every pinned artifact, by
# a documented one-time action:
#   git -C <wolf-std-checkout> archive <rev> std | tar -x -C .wolf-bin/
#   git -C <wolf-std-checkout> rev-parse <rev> > .wolf-bin/std/STD-REV
# lib-toolchain.sh REFUSES when the tree is missing or STD-REV drifts
# from `rev` (a tree has no --version; the marker is its identity).
# KNOWN CAVEAT at this pin trio: wolf-lang#146 (the loop-versioning
# noalias guard built from a non-dominating len load, sc_muladd) —
# re-probed at 32f66bf at THIS bump (the ELEVENTH measurement): the
# issue is OPEN and the gauntlet's release step keeps WOLF_MIDEND=0
# until the fix enters the [wolf] pin; the flip-back rides that bump.
repo = "wolffe-lang/wolf-std"
rev = "bd12ef5f78111383073ff44049c585dda3e85551"
