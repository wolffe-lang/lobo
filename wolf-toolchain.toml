# The pinned toolchain wws is true for (ws00, target 4). The idiom is
# wolf-book's `wolf-toolchain.toml` (repo + rev, CI fetches by commit
# hash and builds), with wolf-std's binary-resolution order for local
# runs: $WOLF_BIN / $LUPIN_BIN → .wolf-bin/ → PATH. `tools/wws-gauntlet`
# verifies identity before anything else and refuses on drift.
#
# Identity is read from the FIRST line of `--version` only (the
# wolf-std F-0064 lesson): `wolf` names no sha of its own — its second
# line names its lupin PAIRING, which is reported, never gated — and
# lupin's line names its wolf-lang conformance pin, which is
# information, not this file's rev.
#
# Bumps are deliberate: their own commit, gauntlet green at the new
# pin, this note updated with what the bump changes for wws.

[wolf]
# wolf-lang at the **v0.2.11 RELEASE TAG** (c9237c1, r16: "release:
# wolf 0.2.11 (wolfgang)"), the release stamp `wolf 0.2.11 (wolfgang,
# pin c9237c1)` — the ws25/ws27 shape, a tag re-pinning the dev sha
# ws30 took (fc07cc5 → c9237c1 is 80 commits: s150–s155, #282, the
# r16 train). D57: the tag's own archive IS the stamped build, so
# this box stages the RELEASE ARCHIVE by digest and builds nothing
# (ws31; the disk held no toolchain build beside two compiler lanes):
#   gh release download v0.2.11 -R wolffe-lang/wolf-lang \
#       --pattern 'wolf-0.2.11-<host>.tar.gz'
#   sha256 a91b77c0… (aarch64-apple-darwin) / c638856e… (x86_64-linux)
#   tar -xzf … && cp wolf-0.2.11-<host>/{wolf,libwolf_rt.a,wolf-cimport-worker} .wolf-bin/
# (the whole archive pair — the driver, the runtime staticlib it
# links, the cimport worker beside it). ci.yml builds the same stamp
# from the tag by hand (WOLF_RELEASE from the tag that points at HEAD,
# WOLF_COMMIT the rev below cut to seven).
#
# fc07cc5 → c9237c1: what the bump brings this repo, each classed at
# the bump and measured after it (docs/PROFILE.md's ws31 addendum
# carries the prediction, the ws31 CHANGELOG entry the numbers). The
# runtime's own delta under crates/wolf_rt/src/ is FIVE files — lib.rs,
# map.rs (new), list.rs (+23), native.rs (+18), task/chan.rs — and
# NONE of fs.rs, net.rs, str.rs, signal.rs, reactor.rs, poll.rs: the
# serving path and the parked signal proc run fc07cc5's code byte for
# byte, so the count (ws30: keepalive 6.25, close 10.16) and
# wolf-lang#302's ~196 futex/s per idle hand are predicted to hold.
#   * s150 — every fn value is a pointer to a callable record
#     (`[abi.native.closure]` rewritten, `[type.fn.value]`); channel
#     payloads beyond a word cross in boxes (`[conc.chan.payload]`).
#     LOWERING + RUNTIME; ZERO HERE: no fn-typed value, no channel in
#     src/ or tests/ (grepped); the `else |e|` handlers are row
#     handlers, and the WIR at fc07cc5 carries zero closure records.
#     The IR is MEASURED at the bump (WIR and release LLVM IR of
#     src/main.lu, both pins, diffed).
#   * s151 — the one-line `if … then … else …`, `then` contextual;
#     `[gram.fmt.if]` never converts between forms. GRAMMAR-WIDENING;
#     ZERO HERE (no bare `if`; wolf-lang measured `fmt --check` over
#     this tree at zero motion before cutting the release).
#   * s152 — `Map[K, V]` typed for str/int/char/bool keys, `m[k]` is
#     `V ! {none}`, `op=` E0417, a struct key E0418; five runtime map
#     seams. TYPING + RUNTIME; ZERO HERE: no `Map` in the tree — the
#     kind table, the head memo and the connection table are lists.
#   * s153 — `[mem.region.escape]`: a `str` built by `+`, `+=` or a
#     holed interpolation is an allocation site in the region of the
#     building expression; leaving it is E1010 (was freed bytes).
#     TIGHTENING — the one rule that could red this build; read
#     against every region block (serve's `resp`/`chunkr`, budget's
#     capped pair): each builds List[byte] only, every `str` inside
#     is lent from outside, every tail is a scalar. PREDICTED ZERO,
#     measured by the gauntlet's build step. `[exec.checked.budget]`
#     is the checked tier's; the corpus's checked lanes are short.
#   * s155 — operators dispatch through traits on a type parameter or
#     a user type; `trait Num = …`. TYPING; ZERO HERE: no trait, no
#     impl in the tree; every operator is on two primitives.
#   * #282 — `wolf --version | head -1` exits 0. MECHANICAL.
#   * r16 — the version sites, the CHANGELOG, the pairing at lupin
#     0.1.32. MECHANICAL here: the `.wolfi` toolchain stamp 0.2.10 →
#     0.2.11 in every header — and, under s148's content-only rule
#     (#292), ONLY the stamp: every hash predicted unchanged, the
#     first pin bump to test that rule.
# Source motion in lobo for the pin's own sake: the `.wolfi` stamp
# and the two shell.lu constants. Nothing else.
# Pairing note (F-0064, reported never gated): wolf@v0.2.11 declares
# lupin **0.1.32** (pin e0ce018 — the release cut before 0.1.33
# tagged) and [lupin] below names **0.1.33**, which declares wolf
# **662b14c = v0.2.10**. ONE RELEASE EACH WAY AT THE TAGS: ws30's gap
# (two releases at a dev sha) is narrower, not closed. What is
# measured: the 63 lupin-lane files of this corpus agree with their
# headers on both machines (the gauntlet); nothing in this corpus
# spells a clause on either side of the gap (s150–s155 here,
# is42–is45 there), so no lane can diverge — a sentence about lobo's
# corpus, not about the pairing.
# The #146 WOLF_MIDEND caveat: re-probed at THIS pin, EIGHTEENTH
# measurement — see the ws31 CHANGELOG entry for the state read at the
# bump; the gauntlet's release step and the release archive's build
# keep WOLF_MIDEND=0 until the fix enters the [wolf] pin. See [std]'s
# note. The shipped binary is the gauntlet's release-tier build, flag
# for flag.
repo = "wolffe-lang/wolf-lang"
rev = "c9237c11d081d5649825b5293bcff6d2814a5ad2"
version_line = "wolf 0.2.11 (wolfgang, pin c9237c1)"

