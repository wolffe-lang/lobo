# The pinned toolchain wws is true for (ws00, target 4). The idiom is
# wolf-book's `wolf-toolchain.toml` (repo + rev, CI fetches by commit
# hash and builds), with wolf-std's binary-resolution order for local
# runs: $WOLF_BIN / $LUPIN_BIN → .wolf-bin/ → PATH. `tools/wws-gauntlet`
# verifies identity before anything else and refuses on drift.
#
# Identity is read from the FIRST line of `--version` only (the
# wolf-std F-0064 lesson): `wolf` names no sha of its own — its second
# line names its lupin PAIRING, which is reported, never gated — and
# lupin's line names its wolf-lang conformance pin, which is
# information, not this file's rev.
#
# Bumps are deliberate: their own commit, gauntlet green at the new
# pin, this note updated with what the bump changes for wws.

[wolf]
# wolf-lang at TRUNK bd7caff (the s141 CHANGELOG commit atop the s141
# merge, "the syscall goes first") — D57 DEV-STAMPED
# `0.2.7+dev.bd7caff`, because r11 had not tagged v0.2.8 when ws24
# reached its pin step (checked: `git tag` tops out at v0.2.7, and
# v0.2.7 (b482c52) is SIX commits behind this rev and carries neither
# #257 nor #254 — the ws23 closeout says so); the contract's either/or
# takes the trunk sha the way ws18 did, and the re-pin to the v0.2.8
# tag rides r11's landing. Build in a scratch worktree at the sha,
# stamping the commit ONLY (no WOLF_RELEASE: a release stamp for a
# version the tag does not point at claims nothing — D57's rule, and
# `build_is_release` would refuse it anyway):
#   git worktree add <scratch> bd7caff
#   WOLF_COMMIT=bd7caff cargo build --release -p wolf_driver -p wolf_rt
# and stage target/release/{wolf, libwolf_rt.a} into .wolf-bin/ — the
# native tier needs the staticlib beside the driver. ci.yml's stage
# step builds exactly this (a trunk pin has no tag at HEAD, so the
# stamp stays `+dev.<short>`).
#
# 398e5f5 → bd7caff is FORTY-FIVE commits over three trains (s139,
# s140, r10's v0.2.7, fa01, s141). What the bump brings this repo,
# each classed at the bump and measured after it:
#   * s141 — **wolf-lang#257 CLOSES** (`[os.net.io]`, the syscall goes
#     first): every parking net call tries the syscall before it
#     waits and parks on WouldBlock only, against the budget computed
#     at entry. The rows are unchanged; the COST moves — ws22's
#     profile put the pre-syscall park at ~30 of lobo's 63 µs per
#     keepalive request, and s141 measured 53.3 → 21.2 µs/request at
#     N=1 on this box (under load; the quiet number is ws24's). One
#     stated consequence a program can build on: a write's budget now
#     covers the whole drain. BEHAVIORAL-COST-ONLY: zero source motion
#     for the pin's own sake.
#   * s141 — **wolf-lang#254 CLOSES** (`[os.net.writev]`,
#     `[os.net.nodelay]`): `net_writev(fd, List[List[byte]]) -> () !
#     {closed, io}` (a gathered write, `net_write`'s rows) and
#     `net_nodelay(fd, bool) -> () ! {io}`, and **TCP_NODELAY is ON by
#     default** on every stream the runtime hands out. TWO NEW
#     BUILTINS (consumed by ws24: the plaintext small-file arm gathers
#     head and body, `tcp_nodelay` is served) and ONE BEHAVIORAL
#     DEFAULT (Nagle off on every accepted stream — the posture nginx
#     takes by `tcp_nodelay on`, its default; nothing lobo serves
#     changes shape, and the linux delayed-ACK stall lobo#3 worked
#     around by copying can no longer arise on any write pattern).
#   * s140 — the stranger's `--help`, a man page, completions; the
#     compile-failure footer names the code actually reported (#249);
#     a `use std.…` miss with no std root configured says so (#251,
#     E0301 gains a NOTE — lobo's build sees it only when WOLF_STD is
#     unset, which lib-toolchain.sh never allows). DIAGNOSTIC-ONLY.
#   * s139 — spec/07 (sched) ruled normative and admitted to
#     [conf.anchor.ns]; xtask only. Nothing lobo cites moved.
#   * r10 — v0.2.7 itself (the workspace version 0.2.6 → 0.2.7, the
#     pairing to lupin 0.1.27); fa01 and the unslop pass — docs.
#     MECHANICAL: the `.wolfi` toolchain stamp reads the VERSION and
#     moves 0.2.6 → 0.2.7+dev.bd7caff in every header.
# Deltas classed at this bump: ONE BEHAVIORAL DEFAULT (#254's
# TCP_NODELAY), ONE BEHAVIORAL-COST-ONLY (#257), TWO NEW BUILTINS
# (#254), DIAGNOSTIC-ONLY (s140), one MECHANICAL (the stamp). Source
# motion predicted for the pin's own sake: ZERO. Source motion this
# sprint takes ON the pin: `serve` (the gather), `config`/`http`/
# `serve`/the entry (`tcp_nodelay`).
# Pairing note (F-0064, reported never gated): wolf@bd7caff declares
# lupin **0.1.27** as its pairing and [lupin] below names 0.1.27 —
# the PAIRING GAP IS ZERO again (it was one at ws19/v0.2.6). THE LANE
# GAP, named: lupin 0.1.27's conformance pin is v0.2.5, so
# `net_writev`/`net_nodelay` do not exist on the lupin lane at this
# trio (the mirror is filed as wolf-interp#67). lupin resolves a
# builtin at the CALL, not at load (probed at the bump: a program
# naming `net_writev` on an unreached path runs), so the lupin-lane
# tests that stage `serve` and never drive its static small-file arm
# keep their lanes; the corpus at the bump is the measurement.
# The #146 WOLF_MIDEND caveat: re-probed at THIS pin, FOURTEENTH
# measurement — still OPEN (the issue's state read at the bump), so
# the gauntlet's release step and the release archive's build both
# keep WOLF_MIDEND=0. See [std]'s note. The shipped binary is the
# gauntlet's release-tier build, flag for flag.
repo = "wolffe-lang/wolf-lang"
rev = "bd7caff78a3002d1b9c24ec1b062b54474231115"
version_line = "wolf 0.2.7+dev.bd7caff (wolfgang, pin bd7caff)"

