# The pinned toolchain wws is true for (ws00, target 4). The idiom is
# wolf-book's `wolf-toolchain.toml` (repo + rev, CI fetches by commit
# hash and builds), with wolf-std's binary-resolution order for local
# runs: $WOLF_BIN / $LUPIN_BIN → .wolf-bin/ → PATH. `tools/wws-gauntlet`
# verifies identity before anything else and refuses on drift.
#
# Identity is read from the FIRST line of `--version` only (the
# wolf-std F-0064 lesson): `wolf` names no sha of its own — its second
# line names its lupin PAIRING, which is reported, never gated — and
# lupin's line names its wolf-lang conformance pin, which is
# information, not this file's rev.
#
# Bumps are deliberate: their own commit, gauntlet green at the new
# pin, this note updated with what the bump changes for wws.

[wolf]
# wolf-lang at the **v0.2.16 RELEASE TAG** (93a5fe5, r21: the point
# release #433 ruled), the release stamp `wolf 0.2.16 (wolfgang, pin
# 93a5fe5)`. 30731a6 -> 93a5fe5 is TWO releases: v0.2.15 (s165's lend
# rule, s167's push ruling, s168's place model, the `copy` that is
# finally real) and v0.2.16 (s169's exit classes, s170's conc surface,
# s173's pools, s175's list-literal element rule, s177's move-on-a-
# field fix, and #226's draft race fixed in release.yml). Staged from
# the RELEASE ARCHIVE by digest, never a build on this box and never
# `~/.local/bin` — the whole archive pair, not one binary:
#   gh release download v0.2.16 -R wolffe-lang/wolf-lang \
#       --pattern 'wolf-0.2.16-<host>.tar.gz'
#   sha256 84e30c05e56b89fde2fe6e27eec8f7cec0a6aae6e1464a2993fcfc87a7a1829e
#       (x86_64-unknown-linux-gnu, measured at ws37; matches the
#        release asset's own digest, release 395302343)
#   sha256 b04310568d0104d7a804917bbd999cf4343c032c6e41aeda61c5b13b194706b5
#       (aarch64-apple-darwin, the release asset's digest)
# and stage `wolf`, `libwolf_rt.a` AND `wolf-cimport-worker` into
# .wolf-bin/. Hash every member BY NAME (the sc51 lesson): `_wolf` is
# the zsh completion script and its digest is `2d1e4801…` at 0.2.14 and
# at 0.2.16 alike — so is `wolf.bash`'s and `wolf.fish`'s. The members
# that actually move across this bump are `wolf` (8a70caaf… ->
# b53b5328…), `libwolf_rt.a` (92741bfe… -> c4c5f670…),
# `wolf-cimport-worker` (d46990be… -> cf2c47a9…), `wolf.1` and
# `README.md`. A check that hashes "the first binary it finds" reads
# the same constant at every pin on every platform.
#
# WHAT THE BUMP CHANGES HERE, classed at the bump and measured after it
# (the ws37 CHANGELOG entry carries the numbers):
#
#   * **s167 / wolf-lang#385 option 3 — `push` COPIES a non-`Copy`
#     element** ([mem.region.edge.elem]). THE item of this bump, and
#     the first pin bump to change what an accepted lobo program COSTS
#     rather than what it means. `push(take x)` moves and is free. The
#     census, measured at the bump: **406 `.push(` sites in src/**, of
#     which **391 are free by the clause's own words** (a scalar, a
#     `str`, or a struct of them — `List[str]`, `List[int]`,
#     `List[byte]`, `List[bool]`, `List[VarSpec]`, `List[Spec]`,
#     `List[SinkRow]`) and **15 reach heap storage and now deep-copy**:
#     twelve `List[GenRow]` sites in the generation-table rebuilds
#     (GenRow carries a whole `config.Conf`, ~30 lists), one
#     `List[AccRow]` (already spelled `copy`), one `List[GenRow]` at
#     the generation-1 seed, and **`serve.lu`'s `parts.push(body)` on
#     the per-response gathered-write path**. That last one is the
#     only one on the serving path and it takes `take` at ws37 (the
#     body is dead after the push), so the copy ws23/ws35 spent two
#     sprints removing does not come back. `tests/` adds 401 more
#     sites, none heap-reaching. ZERO `push(take …)` existed before
#     this bump.
#   * **s165 / wolf-lang#366 — a `read` parameter is LENT, and #384
#     makes `copy` REAL.** Until 0.2.15 the native tiers lowered
#     `copy x` as `x` for heap values, so every `copy` fix-it in this
#     tree was a no-op; it is a deep copy now. The lend rule refused
#     **11 sites** here, every one a true find: `conf_for` and the four
#     `ReqOut`/`ConnStep` constructors, `conn.tls_conn`, `shell.gen_new`
#     and `shell.reload` all handed a value out of something they were
#     only lent. Fixed by `take` where the caller gives it up (free)
#     and by `copy` only where the value genuinely escapes — the two
#     serving callers of `conf_for` read the Conf through
#     `conf_index` and LEND it into the call instead, because the
#     compiler's `copy` fix-it there is a per-connection-step deep copy
#     of the whole model.
#   * **s169 / [conf.exit] — a rejection is 2 and a refusal 4, never
#     1.** ZERO rows here, predicted and measured: `tools/lobo-corpus`
#     drives `conform-run`, which the clause names as NOT a front door
#     (the outcome is the record's and the tool still exits 0,
#     [proto.invoke.exit]). The two `run(exit=1)` fences this repo owns
#     (tests/rig/deadline_timeout.lu, tests/rig/refused_row.lu) are
#     programs that COMPILE and ride an error out of `main` with `?` —
#     the passthrough class, whose status is the program's own answer.
#     No lobo tool tests a front door's status for equality with 1.
#   * **s177 / wolf-lang#444 — `move` on a field path records the
#     move.** ZERO here: there is no `move` expression in src/ or
#     tests/ at all (grepped at the bump; the six matches are prose in
#     comments), so the third silent wrong answer of 0.2.15 never had a
#     witness in this tree.
#   * **s170's conc surface (`Scope`, `Proc[T]`, the typed join, the
#     frozen spawn argument), s173's pools and `handle T`, s175's
#     `[type.list.lit.elem]`.** lobo spawns three procs (budget's two
#     capped bodies and the signal forwarder) and `select`s on them;
#     none takes a scope, a pool or a handle, and there is no list
#     literal in src/ — ZERO source motion, and the corpus at the bump
#     is the measurement.
#   * **wolf-lang#449, OPEN, and the reason this bump is not free.**
#     0.2.16's new E1002 exclusivity leg flags a claim that is not in
#     the outer call's argument list: a `mut` claim inside a branch or
#     a handler arm is reported as "a second claim inside the outer
#     call's extent" of a call that comes LATER in the same function.
#     It refuses code every release through 0.2.15 compiled and lupin
#     0.1.38 still runs. **21 sites here**, in serve, main, resolver
#     and http; boreutils hit the same thing at 12 sites in 7 of 15
#     utilities and filed it. lobo works around it under the issue's
#     number, by choosing the message before the one claim and by
#     moving the `mut` parameter LAST on the five helpers the walk
#     names (the issue's own `l2` control) — and the workarounds are
#     marked to be reverted when #449 lands.
#   * **The glibc floor, measured rather than quoted.** The published
#     x86_64 linux `wolf` imports no symbol above **GLIBC_2.34**
#     (`objdump -T | grep GLIBC | sort -uV | tail -1`), against a
#     release note stating 2.35. Reported, not gated. wolf-lang#447
#     says lupin's own 0.1.38 linux archive needs GLIBC_2.39 — this
#     repo's CI builds lupin from source and never downloads it.
# Pairing note (F-0064, reported never gated): wolf@v0.2.16 declares
# lupin **0.1.38** as its pairing and [lupin] below names 0.1.38 —
# THE PAIRING GAP IS ZERO, and it is the first bump since 0.1.36 where
# it could be, because 0.1.37's conformance pin was off the released
# line. THE LANE GAP, named: 0.1.38's conformance pin is 2e4ca769 =
# **v0.2.15**, one release behind this [wolf] — so s169's exit
# classes, s177's move fix and #449's leg are wolf-side only, and the
# 63 lupin-lane files of this corpus are the measurement.
# The #146 WOLF_MIDEND caveat, TWENTY-FIRST measurement and the first
# one that is not an ICE: **wolf-lang#146 is CLOSED (2026-09-15) and
# the probe agrees.** `wolf build --release ./src/main.lu` with NO
# WOLF_MIDEND=0 exits 0 at this pin trio (ws37, kasumi linux x86-64) —
# twenty measurements running said `ICE: mid-end broke the module` on
# `@std.x.crypto.curve25519.sc_muladd`. The probe cannot say by itself
# whether the compiler or the std tree carried the fix, because both
# moved in this bump. **The flip-back is therefore OWED and is NOT
# taken here**: `tools/lobo-gauntlet`, `tools/lobo-dist` and ci.yml
# still pass WOLF_MIDEND=0, so the shipped binary is the same build
# lobo has shipped since wsm02 and this bump changes no optimization
# profile. Retiring the flag is its own lane, with the gauntlet green
# both ways and docs/BUDGET.md and docs/PARITY.md following. The
# shipped binary is the gauntlet's release-tier build, flag for flag.
repo = "wolffe-lang/wolf-lang"
rev = "93a5fe504593ca7642b78ba83b4986e7a03cfe71"
version_line = "wolf 0.2.16 (wolfgang, pin 93a5fe5)"

