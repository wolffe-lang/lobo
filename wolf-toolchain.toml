# The pinned toolchain wws is true for (ws00, target 4). The idiom is
# wolf-book's `wolf-toolchain.toml` (repo + rev, CI fetches by commit
# hash and builds), with wolf-std's binary-resolution order for local
# runs: $WOLF_BIN / $LUPIN_BIN → .wolf-bin/ → PATH. `tools/wws-gauntlet`
# verifies identity before anything else and refuses on drift.
#
# Identity is read from the FIRST line of `--version` only (the
# wolf-std F-0064 lesson): `wolf` names no sha of its own — its second
# line names its lupin PAIRING, which is reported, never gated — and
# lupin's line names its wolf-lang conformance pin, which is
# information, not this file's rev.
#
# Bumps are deliberate: their own commit, gauntlet green at the new
# pin, this note updated with what the bump changes for wws.

[wolf]
# wolf-lang at the **v0.2.6 RELEASE TAG** (398e5f5, the r09 merge, "the
# accept is fair") — the first lobo pin on a released wolf TAG since
# ws13's v0.2.2, and the one the release archive is reproduced from
# (ws19). D57: built AT the tag the driver claims the bare version, no
# +dev suffix. The ws19 contract's either/or preferred the tag over
# ws18's dev-stamped trunk sha 32f66bf and asked for the delta to be
# MEASURED rather than assumed. It was:
#   32f66bf → 398e5f5 is FIVE commits (a369b22 spec, 6919280 ledger,
#   b2880a4 CHANGELOG, e257914 release sites, 398e5f5 merge); ten
#   files, +325/−89, and under crates/ EXACTLY ONE — the interface-
#   pretty test SNAPSHOT re-recording the toolchain stamp 0.2.5 →
#   0.2.6. Zero compiler source, zero runtime source. The rest is
#   spec/05 [conf.anchor.ns] admitting os/type/ct/diag (#239 — a
#   clause catching up to anchors it already published; nothing lobo
#   cites moved), xtask/src/spec.rs holding that clause, the lockfiles,
#   README and CHANGELOG. So the tag costs this sprint NO source
#   motion: what moves in lobo is the `.wolfi` toolchain stamp
#   (0.2.5 → 0.2.6, every header, ZERO item motion — verified as at
#   ws18) and the version_line below losing its +dev.
# Build in a scratch worktree AT THE TAG with the D57 release stamp
# (xtask's own rule: the release stamp is granted only when that exact
# tag points at HEAD, which is what `build_is_release` checks):
#   git worktree add <scratch> v0.2.6
#   WOLF_RELEASE=v0.2.6 WOLF_COMMIT=398e5f5 \
#     cargo build --release -p wolf_driver -p wolf_rt
# and stage target/release/{wolf, libwolf_rt.a} into .wolf-bin/ — the
# native tier needs the staticlib beside the driver. (`cargo xtask
# install` at the tag produces the same pair; the identity check
# below is what admits either.) The release workflow
# (.github/workflows/release.yml) builds exactly this, from THIS
# file, on every dist host — never from whatever wolf a runner has.
# Deltas classed at this bump: ZERO BEHAVIORAL, ZERO DIAGNOSTIC, one
# MECHANICAL (the `.wolfi` toolchain stamp). #242's fix (s138) was
# already in ws18's pin; nothing about the accept path changes here.
# Pairing note (F-0064, reported never gated): wolf@v0.2.6 declares
# lupin **0.1.26** as its pairing and [lupin] below names 0.1.27 —
# the PAIRING GAP IS ONE, in the direction D57 calls advance notice
# (a newer sibling than the compiler was released against). It was
# zero at ws15 and ws18; it re-opens here because lupin 0.1.27 (is38)
# tagged the same day as wolf 0.2.6 (r09) and each release deliberately
# did not take the other mid-sprint (both CHANGELOGs say so). Not a
# gate; the next wolf release closes it.
# The #146 WOLF_MIDEND caveat: re-probed at THIS pin, TWELFTH
# measurement — still OPEN (the issue's state read at the bump), so
# the gauntlet's release step and the release archive's build both
# keep WOLF_MIDEND=0. See [std]'s note. The shipped binary is the
# gauntlet's release-tier build, flag for flag.
repo = "wolffe-lang/wolf-lang"
rev = "398e5f547a65308c6a3e88fee632563e87afd217"
version_line = "wolf 0.2.6 (wolfgang, pin 398e5f5)"

[lupin]
