# The pinned toolchain wws is true for (ws00, target 4). The idiom is
# wolf-book's `wolf-toolchain.toml` (repo + rev, CI fetches by commit
# hash and builds), with wolf-std's binary-resolution order for local
# runs: $WOLF_BIN / $LUPIN_BIN → .wolf-bin/ → PATH. `tools/wws-gauntlet`
# verifies identity before anything else and refuses on drift.
#
# Identity is read from the FIRST line of `--version` only (the
# wolf-std F-0064 lesson): `wolf` names no sha of its own — its second
# line names its lupin PAIRING, which is reported, never gated — and
# lupin's line names its wolf-lang conformance pin, which is
# information, not this file's rev.
#
# Bumps are deliberate: their own commit, gauntlet green at the new
# pin, this note updated with what the bump changes for wws.

[wolf]
# wolf-lang at TRUNK 32f66bf (the s138 merge, "the accept is fair") —
# D57 DEV-STAMPED `0.2.5+dev.32f66bf`, because r09 had not tagged
# v0.2.6 at ws18's pin step (checked: `git tag` tops out at v0.2.5, and
# v0.2.5 is SEVENTEEN commits behind this rev — it does not carry
# s138); the contract's either/or takes the trunk sha, as ws14, ws16
# and ws17 did. Build in a scratch worktree at the sha, stamping the
# commit ONLY (no WOLF_RELEASE: a release stamp for a version the tag
# does not point at claims nothing — D57's rule, and `build_is_release`
# would refuse it anyway):
#   git worktree add <scratch> 32f66bf
#   WOLF_COMMIT=32f66bf cargo build --release -p wolf_driver -p wolf_rt
# and stage target/release/{wolf, libwolf_rt.a} into .wolf-bin/ — the
# native tier needs the staticlib beside the driver.
#
# d6aeaca → 32f66bf is TWENTY-ONE commits over two trains (r08's v0.2.5
# release and s138). What the bump brings this repo, each measured at
# the bump:
#   * s138 — **wolf-lang#242 CLOSES**, and it is the whole reason this
#     sprint exists. `net_accept` no longer parks: a listener lives
#     NON-BLOCKING under the runtime, the take after a readiness wake
#     either finds the connection or finds nothing, and a hand that
#     finds nothing WAITS AGAIN against the same budget — the one its
#     `net_deadline` armed when the call began, never a fresh one. A
#     lost race therefore answers NOTHING: not a new row, not an empty
#     handle, not a trap. `[os.net.accept]` is a new clause and
#     `[os.net.wait]` gains the sentence this repo paid to learn —
#     **readiness is not exclusivity**. The signature and rows are
#     UNCHANGED, so the delta is BEHAVIORAL-ONLY and its whole visible
#     effect in lobo is a DELETION: the ws17 accept turn
#     (`shell.accept_turn`, `accept_wait_ms`, `accept_slice_ms`, the
#     `--hands` flag) comes out and the hands go free-for-all. The
#     budget that bounds a lost race is already armed — `arm_accept`'s
#     5 ms `net_deadline`, which at the ws17 pin governed only the
#     readiness wait and now governs the whole call.
#   * s138 — #243 (a keyword-named parameter with no `:` is ONE report)
#     and #238 (r08: a diagnostic underline clamps into the window at
#     BOTH ends, which used to kill the driver and emit no record).
#     Both are DIAGNOSTIC-ONLY: lobo's sources draw neither, measured
#     by the fmt and build steps, which are the whole test.
#   * r08 — v0.2.5 itself: the release train. Nothing lobo's sources
#     reach; the toolchain stamp in every `.wolfi` reads the VERSION,
#     which moves 0.2.4 → 0.2.5, so the fourteen snapshots re-record
#     with ZERO item motion from the stamp alone (the ws15/ws17
#     precedent, verified the same way).
# Deltas classed at this bump: ONE BEHAVIORAL (#242, consumed as a
# deletion), TWO DIAGNOSTIC-ONLY, one MECHANICAL (the `.wolfi`
# toolchain stamp), zero source motion predicted and ZERO MEASURED —
# the byte migration closed at ws17, so this is the first pin bump in
# this repo's history that moves no source at all for the pin's own
# sake.
# Pairing note (F-0064, reported never gated): wolf@32f66bf declares
# lupin **0.1.26** as its pairing, and [lupin] below names 0.1.26 —
# the PAIRING GAP IS ZERO, for the second time (ws15 was the first).
# THE LANE GAP, NAMED, and it does NOT close here: lupin 0.1.26 is
# is37, whose conformance pin is still 982f857 (the v0.2.4 tag) — one
# train behind s137 and two behind s138. So none of the s137 builtins
# (`net_wait`, `net_listen_with`, `os_spawn_with`, `net_adopt_listener`,
# `os_cpus`) exist on the lupin lane at this trio, and every lobo test
# that names one still declares `lanes: native` (or native+checked
# where the checked machine serves it). #242's fix is a RUNTIME change
# to a call lupin does not have, so the lane gap is unmoved by it. The
# gap closes at the lupin release that pins s137 or later.
# The #146 WOLF_MIDEND caveat: re-probed at THIS pin, ELEVENTH
# measurement — still open, the gauntlet's release step keeps
# WOLF_MIDEND=0. See [std]'s note.
repo = "wolffe-lang/wolf-lang"
rev = "32f66bf2be675d274d7bb4d8a8ca6233b2ba24a8"
version_line = "wolf 0.2.5+dev.32f66bf (wolfgang, pin 32f66bf)"

[lupin]
# lupin at the v0.1.26 RELEASE TAG (5e774a2; D57: build the tag, so
# --version claims the release with no +dev suffix). 0.1.26 is is37
# ("the byte has a domain"): a `List[byte]` knows its element, so a
# byte-domain violation is a RESOLVE-TIME refusal on the reference
# machine and holds at `run` too (wolf-interp#62), plus D74's five
# lexer witnesses answering wolfc code and span (#59) and E0301's note
# naming the closed type set (#60). It is the interpreter half of the
# byte work lobo's sources migrated to at ws17 — a TIGHTENING, so the
# thing it could do to this repo is REFUSE a byte-domain slip the
# native tier let through. It does not: the corpus is green on every
# lupin lane at this trio, measured at the bump. Its conformance pin
# (982f857, the v0.2.4 tag) is information, not this file's rev, and it
# is why the lane gap in [wolf] stays open.
# Bumped together with [wolf] as always. Build AT THE TAG (scratch
# worktree):
#   git checkout v0.1.26 && cargo build --release --bin lupin
# stage target/release/lupin into .wolf-bin/.
repo = "wolffe-lang/wolf-interp"
rev = "5e774a2764dd37137b1af41cc4c4e1e1ca0afb8e"
version_line = "lupin 0.1.26 (wolf-interp, reference interpreter at pin 982f857)"

[std]
# wolf-std, pinned at TRUNK bd12ef5 (the sc37 docs commit atop the sc37
# merge, "the words come true"): the bump that ANSWERS wolf-std#6.
# `std.net.listen_with(addr, opts)` / `std.net.adopt_listener(fd)` /
# `std.net.wait(fds, deadline_ms)` and a new `std.os.cpus()` now exist,
# both acquisition calls answering the ORDINARY `Listener`.
# **THE DECISION, taken deliberately at ws18 and not by default: lobo's
# serving loop STAYS ON THE BUILTINS at this pin, and the reason is the
# loop's own shape, not inertia.** Three facts, each checked against
# the source rather than assumed:
#   1. The loop is RAW-FD end to end. `net_wait` multiplexes ONE
#      `List[int]` holding the control listener, both http listeners
#      and every open connection, and the connection table is parallel
#      `List`s indexed by position; `net_accept`/`net_read`/
#      `net_write`/`net_deadline`/`net_close` all take that int.
#      `std.net`'s tier is typed (`Listener`/`Socket`), and `wait`
#      takes `List[int]` regardless — so a Listener would be built and
#      immediately unwrapped through `.fd` to enter the same set.
#   2. The inherit PAIR would split across tiers. sc37 wrapped the
#      acquisition half only; `os_spawn_with` is deliberately not
#      wrapped (std.process's `Command` question is unanswered), so a
#      master would spawn through the BUILTIN and its hand would adopt
#      through STD — two tiers for one handshake, which is worse to
#      read than one.
#   3. Nothing behavioral is on offer. Every one of the four is a pure
#      delegate; moving would buy a spelling.
# So the posture is UNIFORM and stated: the many-hands listener path,
# the readiness wait and the cpu count all call the builtins, exactly
# as the rest of the loop does. What WOULD move it is a sprint that
# adopts `std.net`'s types through the whole serving loop — routed as
# residue, not smuggled into a pin bump. lobo's preference on
# `os_spawn_with`'s std shape is posted on wolf-std#6, which sc37 asked
# for by name.
# c0f75e8 → bd12ef5 also carries sc37's wolf-side bump (982f857 →
# 6ade878, all three std pins on one sha), the ten byte-domain ledger
# rows coming true, API-CONVENTIONS §14's amendments, and F-0110: every
# one of the six new rows is `lupin = "unsupported"` because lupin
# 0.1.26 conforms to v0.2.4 — a CALENDAR, not a semantics, and the same
# lane gap [wolf] names.
# NOT a binary: a SOURCE TREE the toolchain resolves `use std.…`
# against (`--std-root` / $WOLF_STD — the driver's own mechanism;
# lib-toolchain.sh exports it). Staged, like every pinned artifact, by
# a documented one-time action:
#   git -C <wolf-std-checkout> archive <rev> std | tar -x -C .wolf-bin/
#   git -C <wolf-std-checkout> rev-parse <rev> > .wolf-bin/std/STD-REV
# lib-toolchain.sh REFUSES when the tree is missing or STD-REV drifts
# from `rev` (a tree has no --version; the marker is its identity).
# KNOWN CAVEAT at this pin trio: wolf-lang#146 (the loop-versioning
# noalias guard built from a non-dominating len load, sc_muladd) —
# re-probed at 32f66bf at THIS bump (the ELEVENTH measurement): the
# issue is OPEN and the gauntlet's release step keeps WOLF_MIDEND=0
# until the fix enters the [wolf] pin; the flip-back rides that bump.
repo = "wolffe-lang/wolf-std"
rev = "bd12ef5f78111383073ff44049c585dda3e85551"
