#     `str`, or a struct of them — `List[str]`, `List[int]`,
#     `List[byte]`, `List[bool]`, `List[VarSpec]`, `List[Spec]`,
#     `List[SinkRow]`) and **15 reach heap storage and now deep-copy**:
#     twelve `List[GenRow]` sites in the generation-table rebuilds
#     (GenRow carries a whole `config.Conf`, ~30 lists), one
#     `List[AccRow]` (already spelled `copy`), one `List[GenRow]` at
#     the generation-1 seed, and **`serve.lu`'s `parts.push(body)` on
#     the per-response gathered-write path**. That last one is the
#     only one on the serving path and it takes `take` at ws37 (the
#     body is dead after the push), so the copy ws23/ws35 spent two
#     sprints removing does not come back. `tests/` adds 401 more
#     sites, none heap-reaching. ZERO `push(take …)` existed before
#     this bump.
#   * **s165 / wolf-lang#366 — a `read` parameter is LENT, and #384
#     makes `copy` REAL.** Until 0.2.15 the native tiers lowered
#     `copy x` as `x` for heap values, so every `copy` fix-it in this
#     tree was a no-op; it is a deep copy now. The lend rule refused
#     **11 sites** here, every one a true find: `conf_for` and the four
#     `ReqOut`/`ConnStep` constructors, `conn.tls_conn`, `shell.gen_new`
#     and `shell.reload` all handed a value out of something they were
#     only lent. Fixed by `take` where the caller gives it up (free)
#     and by `copy` only where the value genuinely escapes — the two
#     serving callers of `conf_for` read the Conf through
#     `conf_index` and LEND it into the call instead, because the
#     compiler's `copy` fix-it there is a per-connection-step deep copy
#     of the whole model.
#   * **s169 / [conf.exit] — a rejection is 2 and a refusal 4, never
#     1.** ZERO rows here, predicted and measured: `tools/lobo-corpus`
#     drives `conform-run`, which the clause names as NOT a front door
#     (the outcome is the record's and the tool still exits 0,
#     [proto.invoke.exit]). The two `run(exit=1)` fences this repo owns
#     (tests/rig/deadline_timeout.lu, tests/rig/refused_row.lu) are
#     programs that COMPILE and ride an error out of `main` with `?` —
#     the passthrough class, whose status is the program's own answer.
#     No lobo tool tests a front door's status for equality with 1.
#   * **s177 / wolf-lang#444 — `move` on a field path records the
#     move.** ZERO here: there is no `move` expression in src/ or
#     tests/ at all (grepped at the bump; the six matches are prose in
#     comments), so the third silent wrong answer of 0.2.15 never had a
#     witness in this tree.
#   * **s170's conc surface (`Scope`, `Proc[T]`, the typed join, the
#     frozen spawn argument), s173's pools and `handle T`, s175's
#     `[type.list.lit.elem]`.** lobo spawns three procs (budget's two
#     capped bodies and the signal forwarder) and `select`s on them;
#     none takes a scope, a pool or a handle, and there is no list
#     literal in src/ — ZERO source motion, and the corpus at the bump
#     is the measurement.
#   * **wolf-lang#449, OPEN, and the reason this bump is not free.**
#     0.2.16's new E1002 exclusivity leg flags a claim that is not in
#     the outer call's argument list: a `mut` claim inside a branch or
#     a handler arm is reported as "a second claim inside the outer
#     call's extent" of a call that comes LATER in the same function.
#     It refuses code every release through 0.2.15 compiled and lupin
#     0.1.38 still runs. **21 sites here**, in serve, main, resolver
#     and http; boreutils hit the same thing at 12 sites in 7 of 15
#     utilities and filed it. lobo works around it under the issue's
#     number, by choosing the message before the one claim and by
#     moving the `mut` parameter LAST on the five helpers the walk
#     names (the issue's own `l2` control) — and the workarounds are
#     marked to be reverted when #449 lands.
#   * **The glibc floor, measured rather than quoted.** The published
#     x86_64 linux `wolf` imports no symbol above **GLIBC_2.34**
#     (`objdump -T | grep GLIBC | sort -uV | tail -1`), against a
#     release note stating 2.35. Reported, not gated. wolf-lang#447
#     says lupin's own 0.1.38 linux archive needs GLIBC_2.39 — this
#     repo's CI builds lupin from source and never downloads it.
