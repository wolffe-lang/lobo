#   * NOTHING ELSE IN THE SPAN TOUCHES THIS TREE, and that is measured
#     by the gauntlet at the new pin, not argued. The span's typing
#     and lowering work is #297, #318, #323, #325, #326, #327, #329,
#     #331, #332, #333, #334, #336, #337, #341 — every one a
