# The pinned toolchain wws is true for (ws00, target 4). The idiom is
# wolf-book's `wolf-toolchain.toml` (repo + rev, CI fetches by commit
# hash and builds), with wolf-std's binary-resolution order for local
# runs: $WOLF_BIN / $LUPIN_BIN → .wolf-bin/ → PATH. `tools/wws-gauntlet`
# verifies identity before anything else and refuses on drift.
#
# Identity is read from the FIRST line of `--version` only (the
# wolf-std F-0064 lesson): `wolf` names no sha of its own — its second
# line names its lupin PAIRING, which is reported, never gated — and
# lupin's line names its wolf-lang conformance pin, which is
# information, not this file's rev.
#
# Bumps are deliberate: their own commit, gauntlet green at the new
# pin, this note updated with what the bump changes for wws.

[wolf]
# wolf-lang at the **v0.2.14 RELEASE TAG** (30731a6, r19: "wolf 0.2.14
# (wolfgang)"), the release stamp `wolf 0.2.14 (wolfgang, pin
# 30731a6)`. a7f517e -> 30731a6 is two releases: v0.2.13 (s157's ten
# papercuts, s158's list literals / `range[T]` / error-set aliases,
# the pairing at lupin 0.1.35) and v0.2.14 (s159's papercuts IV,
# s160's string runtime, the pairing at lupin 0.1.36). D57: the tag's
# own archive IS the stamped build, so this box stages the RELEASE
# ARCHIVE by digest and builds nothing:
#   gh release download v0.2.14 -R wolffe-lang/wolf-lang \
#       --pattern 'wolf-0.2.14-<host>.tar.gz'
#   sha256 80407e31b89cae684163fd9fd79c3935a5fe63873dcb16376c36c8596af61b54
#       (aarch64-apple-darwin, measured at ws35)
#   sha256 13b4de6d0d37fe31a719e4b89033f8e55791e2a99afe6b4c83db686f93c60d05
#       (x86_64-unknown-linux-gnu, measured at ws35)
#   tar -xzf … && cp wolf-0.2.14-<host>/{wolf,libwolf_rt.a,wolf-cimport-worker} .wolf-bin/
# (the whole archive pair — the driver, the runtime staticlib it
# links, the cimport worker beside it).
#
# WHAT THE BUMP BRINGS THIS REPO, predicted before the first build at
# the new pin (scratch ws35-prediction.md) and measured after it.
#
#   * ONE ROW, and it is the one wolf-lang s160 swept for: s160's
#     `[mem.region.escape]` second half — a `str` read carries its
#     place's allocation sites through a PROJECTION, not only out of
#     a whole local — turns `acc.addr = pl.pt.authority`
#     (src/proxy/proxy.lu:1882) into E1004 under `[mem.region.edge]`'s
#     field-store arm (lobo#21). PREDICTED exactly one row moved by
#     the new compiler; MEASURED: the debug-tier build at this pin
#     stops on exactly that one error and no other, with zero
#     warnings. The repair is the one-word `copy`, taken in the
#     commit after this one; the row is the pool-resolves-to-nothing
#     502 arm, on no success path, so the copy's cost (one ambient
#     allocation of the authority's length per such 502) is paid
#     beside a gateway-error body that already allocates.
#   * THE FORMATTER: ZERO. PREDICTED 0 files (v0.2.13's notes measured
#     lobo unchanged file-for-file; v0.2.14 carries no fmt commit);
#     MEASURED with the release binary over src/ + tests/ (150 .lu):
#     `fmt --check` exits 0, no file re-lays. ws34's pass at 0.2.12
#     was the last re-lay this tree owed.
#   * THE STRING RUNTIME (s160), which is what this bump is FOR:
#       #191  a `str` materialization charges the CURRENT region, not
#             the process root (`[mem.region.account.1]`'s per-tier
#             gap closed). On this serving path nothing `str`-shaped
#             materializes inside `region resp` / `region chunkr`
#             (the head is a memo since ws28, the body a `List[byte]`)
#             so the retained bytes per request are predicted to hold;
#             a `str` built inside a region anywhere else now frees
#             with it instead of leaking (docs/PROFILE.md, ws35).
#       #299  `net_writev_head(fd, head: str, parts)` —
#             `[os.net.writev.head]`: the response head enters the
#             gather as the `{ptr, len}` it already is, no `List[byte]`
#             copy. RT_SYMBOLS 143 -> 144. Taken on the response path
#             in a later commit of ws35 (docs/PROFILE.md carries the
#             prediction and the number).
#       #355  `[mem.region.proc]` — a spawned proc's ambient is its own
#             region. ZERO HERE: lobo's procs (the signal forwarder,
#             the hands' control tasks) send no `str` they built.
#       #321  `upper`/`lower`/`repeat`/`replace`/`str_from_utf8` are
#             sites; the projected read above is the one row.
#   * s157 / s158 / s159 (v0.2.13 and the papercuts IV): every one a
#     widening this tree does not spell (no list literal, no
#     `range[T]` type, no `error` alias, no closure-parameter call, no
#     `take` on a `read` parameter — the two `take` sites here move
#     values) or a wording/parser-recovery change. PREDICTED ZERO;
#     MEASURED by the build above (one error, the s160 row) and by
#     the corpus at this pin.
#   * r19 — the `.wolfi` toolchain stamp 0.2.12 -> 0.2.14 in every
#     header. MEASURED: all 14 `.wolfi` carry the stamp line; the
#     [wolf] half moves NO hash (#292's content-only rule, third pin
#     bump to test it). The hash motion in five of them is [std]'s —
#     see that section.
#
# Source motion in lobo for the pin's own sake: the `.wolfi` stamp
# and the three shell.lu constants (toolchain_version, toolchain_pin,
# std_rev — the third moves because [std] moves in the same commit).
# Pairing note (F-0064, reported never gated): wolf@v0.2.14 declares
# lupin **0.1.36** (pin a7f517e — the v0.2.12 TAG) and [lupin] below
# names **0.1.36**: the compiler's side of the pairing is CLOSED for
# the first time since ws30. The interpreter's side is two releases
# behind (0.1.36 conforms to v0.2.12; v0.2.13 and v0.2.14 unanswered,
# wolf-interp#111 holds the rows). Nothing in this corpus spells an
# s157–s160 clause on a lupin lane, so no lane can diverge; the
# lupin-lane files agree with their headers on both machines, which
# is what the gauntlet measures.
# The #146 WOLF_MIDEND caveat: re-probed at THIS pin, TWENTIETH
# measurement — **still OPEN at v0.2.14**. A plain release build of
# src/main.lu without the flag dies `ICE: mid-end broke the module`
# on `@std.x.crypto.curve25519.sc_muladd` (`%19 is not dominated by
# its definition`) at std 2d10219 exactly as at bd12ef5, measured at
# ws35. The gauntlet's release step and the release archive's build
# keep WOLF_MIDEND=0 until the fix enters the [wolf] pin. The shipped
# binary is the gauntlet's release-tier build, flag for flag.
repo = "wolffe-lang/wolf-lang"
rev = "30731a6509443ade03724707345da9ceb86a88bf"
version_line = "wolf 0.2.14 (wolfgang, pin 30731a6)"

