# The pinned toolchain wws is true for (ws00, target 4). The idiom is
# wolf-book's `wolf-toolchain.toml` (repo + rev, CI fetches by commit
# hash and builds), with wolf-std's binary-resolution order for local
# runs: $WOLF_BIN / $LUPIN_BIN → .wolf-bin/ → PATH. `tools/wws-gauntlet`
# verifies identity before anything else and refuses on drift.
#
# Identity is read from the FIRST line of `--version` only (the
# wolf-std F-0064 lesson): `wolf` names no sha of its own — its second
# line names its lupin PAIRING, which is reported, never gated — and
# lupin's line names its wolf-lang conformance pin, which is
# information, not this file's rev.
#
# Bumps are deliberate: their own commit, gauntlet green at the new
# pin, this note updated with what the bump changes for wws.

[wolf]
# wolf-lang TRUNK at ws12 acquisition (e6cf24e — the 2026-09-01 ledger
# ritual atop s131). The v0.2.1 tag EXISTS now (75fd2d0, seven commits
# back), but the number this sprint came for — `region_bytes(r)` /
# `live_region_bytes()`, `[mem.region.account.1/.2]` — landed in s131
# AFTER it, so a tag build would not carry it. Trunk, therefore, in
# the D57 DEV-STAMP shape sc30/wsm04 recorded: built with
# WOLF_COMMIT=e6cf24e (the xtask dist stamp, computed by the builder —
# D33 bans build scripts), so `--version` claims `0.2.1+dev.e6cf24e`
# and the binary's own pin clause agrees with this rev by
# construction. A PLAIN `cargo build` is unstamped and prints
# `+dev.unknown` — the identity check below refuses it (unverifiable
# is dev). What the bump brings this repo, each measured not assumed
# at the bump:
#   * s131 (a2ae70b) — THE SPRINT'S REASON: region_bytes/live_region_bytes
#     three-tier, prelude builtins typed pure. lobo's ws10 meter stops
#     estimating from the outside.
#   * r04 (e6548a9) — #192's two halves fixed: W1001 gains its call
#     test (the "misleading W1001" BUDGET.md recorded at addcd7f is
#     GONE at this pin — re-probed, see docs/BUDGET.md) and E1010
#     reads through the error row; D66's defer-at-scope-exit sentence;
#     #189's \u{...} bound.
#   * D67 (be3af95) — the comma insists in PATTERNS: separators
#     required between struct/tuple/call pattern members. Blast radius
#     on lobo measured at the bump: zero (fmt emits no lax form, and
#     lobo's tree round-trips byte-identical).
#   * s128-s130 carried forward from the previous pin's note.
# The #146 WOLF_MIDEND caveat: re-probed at THIS pin, FIFTH
# measurement — still open, the gauntlet's release step keeps
# WOLF_MIDEND=0. See [std]'s note.
# Pairing note (F-0064, reported never gated): wolf@e6cf24e declares
# lupin 0.1.20 and the staged sibling IS 0.1.20 — the advance notice
# wsm04 recorded has caught up; the pairing agrees exactly.
# Build (in a scratch clone at the rev):
#   WOLF_COMMIT=e6cf24e cargo build --release -p wolf_driver -p wolf_rt
# and stage target/release/{wolf, libwolf_rt.a} into .wolf-bin/ —
# the native tier needs the staticlib beside the driver.
repo = "wolffe-lang/wolf-lang"
rev = "e6cf24e7c03f25c8ac6676fc9cb743827524bc8e"
version_line = "wolf 0.2.1+dev.e6cf24e (wolfgang, pin e6cf24e)"

[lupin]
# lupin at the v0.1.20 RELEASE TAG (D57: build the tag, so --version
# claims the release with no +dev suffix). The named fallback wsm04
# took — 0.1.19, because is31 had not shipped — retires here: 0.1.20
# is the sibling wolf-std pins at sc31, so lobo, wolf-std and the
# wolf driver's own pairing line all name the SAME interpreter for the
# first time. 0.1.20 carries is31 (the arms agree — match arms over
# the product domain, lupin's half of s130); is30's net byte tier
# (net_read_bytes/net_write_bytes, F-0102) rides forward unchanged and
# stays the load-bearing piece for std.x.tls.client's loopback
# handshake on the lupin lane. Its conformance pin (b80d239, the
# v0.2.1 release's parent — seven commits behind [wolf]'s e6cf24e) is
# information, not this file's rev. Bumped together with [wolf] as
# always. Build AT THE TAG (scratch clone):
#   git checkout v0.1.20 && cargo build --release --bin lupin
# stage target/release/lupin into .wolf-bin/.
repo = "wolffe-lang/wolf-interp"
rev = "e3736c154dad2d5c4bdb7b7ad706b74b56a903f0"
version_line = "lupin 0.1.20 (wolf-interp, reference interpreter at pin b80d239)"

[std]
# wolf-std, pinned at TRUNK a62a5d4 (the sc31 docs commit atop the
# sc31 merge) — THE BUMP THAT CARRIES `named` / `row_name`
# (wolf-std#3, sc31: `std.x.tls.client`'s whole 21-row refusal
# vocabulary as two thin faces over ONE match — `named(v)` rides the
# value through and coarsens a refusal to `Row(str)`; `row_name(v)`
# answers the row's own name, or the reserved `"ok"`). ws12 adopts
# them at lobo's two TLS-client error sites; `cert.validate_chain`'s
# nine rows ride in by width subtyping. The sc29 surface this repo
# already consumes (std.x.tls.client's two-phase begin/complete,
# caller-owned dial and trust anchors, verifying CertificateVerify) is
# unchanged — sc31's adoption is opt-in and moves no existing
# signature. NOT a binary: a SOURCE TREE the toolchain resolves
# `use std.…` against (`--std-root` / $WOLF_STD — the driver's own
# mechanism; lib-toolchain.sh exports it). Staged, like every pinned
# artifact, by a documented one-time action:
#   git -C <wolf-std-checkout> archive <rev> std | tar -x -C .wolf-bin/
#   git -C <wolf-std-checkout> rev-parse <rev> > .wolf-bin/std/STD-REV
# lib-toolchain.sh REFUSES when the tree is missing or STD-REV drifts
# from `rev` (a tree has no --version; the marker is its identity).
# PIN AGREEMENT at this bump (measured, not assumed): wolf-std's own
# wolf pin at a62a5d4 is 75fd2d0 (the v0.2.1 tag) and its lupin pin is
# 0.1.20. This repo's [lupin] AGREES exactly; this repo's [wolf] runs
# SEVEN COMMITS AHEAD of std's — deliberately, and named: s131's
# region query is the whole reason for the bump and post-dates the
# tag. wsm04's "no forward drift for the first time" therefore does
# not hold here; the drift is forward-only (std is built against an
# ancestor of our driver) and the gauntlet's both-tiers build over the
# staged tree is the measurement that it carries.
# KNOWN CAVEAT at this pin pair: wolf-lang#146 (the loop-versioning
# noalias guard built from a non-dominating len load, sc_muladd) —
# re-probed at e6cf24e at THIS bump (the FIFTH measurement, recorded
# in the wsc03 closeout): the gauntlet's release step keeps
# WOLF_MIDEND=0 until the fix enters the [wolf] pin; the flip-back
# rides that bump.
repo = "wolffe-lang/wolf-std"
rev = "a62a5d4248c391b3c26d51195ed5cfd69732b9ce"
