[std]
# wolf-std, pinned at TRUNK 2d10219 (the sc47 CHANGELOG commit atop
# the sc47 merge, 2026-09-12). bd12ef5 -> 2d10219 is 148 commits,
# sc38–sc47; under std/ it is 16 files, +1303/-129. **wolf-std's OWN
# upstream pin at this sha is a7f517e = v0.2.12** (vendor/upstream/PIN):
# no wolf-std commit pins v0.2.14 when ws35 runs — no "the std takes
# the release" lane has run for 0.2.13 or 0.2.14 — so this is the
# NEAREST trunk sha, read rather than guessed, one release behind
# [wolf]. Measured at ws35 rather than assumed: the tree compiles
# under 0.2.14 with the s160 escape rules (wolf-lang s160's sweep
# read 0 rows across its 50 module entries at this trunk), and so
# does bd12ef5 — the same single lobo row (lobo#21) is the only error
# under either std tree, so the move is a CHOICE (the newest tree
# s160 swept) and not a necessity.
# What the span changes among the modules lobo imports (std.net,
# std.hex, std.base64, std.x.jose, std.x.crypto.curve25519, std.x.tls
# cert/client/handshake/record): `std/net/net.lu` +211 (c7e9897: the
# gathered write and Nagle's default said out loud; 5d20ed6: accept's
# clause agrees with [os.net.accept]) and the three std.x.tls files
# (6b36d99 / fde6cda: `wolf fmt std` onto the fixed point, no
# behaviour byte moved; 3fe916e: F-0112, net.write's doc). MEASURED
# consequence in this tree: the `.wolfi` dep hashes of `std.net` and
# `std.x.tls.client` move, so `acme` and `proxy` (their importers) and
# `dryrun`, `serve`, `root` (their dependents) carry new
# export_hash/pkg_hash lines — 20 hash lines across five files,
# recorded in the stamp commit and named there as [std]'s, not
# [wolf]'s. Behaviour: the differential, the proxy differential and
# the TLS interop witnesses gate it (gauntlet green at this pin).
# THE DECISION taken at ws18 stands unchanged: lobo's serving loop
# STAYS ON THE BUILTINS. Three facts, each checked against the source
# rather than assumed:
#   1. The loop is RAW-FD end to end. `net_wait` multiplexes ONE
#      `List[int]` holding the control listener, both http listeners
#      and every open connection, and the connection table is parallel
#      `List`s indexed by position; `net_accept`/`net_read`/
#      `net_write`/`net_deadline`/`net_close` all take that int.
#      `std.net`'s tier is typed (`Listener`/`Socket`), and `wait`
#      takes `List[int]` regardless — so a Listener would be built and
#      immediately unwrapped through `.fd` to enter the same set.
#   2. The inherit PAIR would split across tiers. sc37 wrapped the
#      acquisition half only; `os_spawn_with` is deliberately not
#      wrapped (std.process's `Command` question is unanswered), so a
#      master would spawn through the BUILTIN and its hand would adopt
#      through STD — two tiers for one handshake, which is worse to
#      read than one.
#   3. Nothing behavioral is on offer. Every one of the four is a pure
#      delegate; moving would buy a spelling.
# What WOULD move it is a sprint that adopts `std.net`'s types through
# the whole serving loop — routed as residue, not smuggled into a pin
# bump.
# NOT a binary: a SOURCE TREE the toolchain resolves `use std.…`
# against (`--std-root` / $WOLF_STD — the driver's own mechanism;
# lib-toolchain.sh exports it). Staged, like every pinned artifact, by
# a documented one-time action:
#   git -C <wolf-std-checkout> archive <rev> std | tar -x -C .wolf-bin/
#   git -C <wolf-std-checkout> rev-parse <rev> > .wolf-bin/std/STD-REV
# lib-toolchain.sh REFUSES when the tree is missing or STD-REV drifts
# from `rev` (a tree has no --version; the marker is its identity).
# KNOWN CAVEAT at this pin trio: wolf-lang#146 (the loop-versioning
# noalias guard built from a non-dominating len load, sc_muladd) —
# re-probed at THIS bump (the TWENTIETH measurement, see [wolf]): the
# issue is OPEN and the gauntlet's release step keeps WOLF_MIDEND=0
# until the fix enters the [wolf] pin; the flip-back rides that bump.
repo = "wolffe-lang/wolf-std"
rev = "2d1021996da6cde7b14c41ee4ef9d10125182e13"
