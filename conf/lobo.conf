# lobo.conf — the stock configuration the release archive ships (ws19).
#
# It serves html/ from this directory on LOOPBACK port 8080, so the
# archive works the moment it is unpacked and reaches nobody but you
# until you say otherwise. Run it from the archive directory (the
# prefix is `.` and every relative path below resolves against it):
#
#     ./lobo -t -c conf/lobo.conf        # test the config: syntax AND routing
#     ./lobo -c conf/lobo.conf serve     # serve (foreground; Ctrl-C stops it)
#     curl -i http://127.0.0.1:8080/     # the page
#     ./lobo -s reload -c conf/lobo.conf # reload; `-s stop` stops
#
# This is an nginx.conf. Everything nginx's `-t` accepts here, lobo's
# accepts; the directive table (docs/directives.md) names each
# directive's status and every named delta. To reach the network,
# change `listen` (`listen 80;` binds every interface, as nginx does).

pid logs/lobo.pid;
error_log logs/error.log;

# The control endpoint: what `-s reload` / `-s stop` / `lobo status`
# talk to (docs/CONTROL.md). A unix socket is a uid boundary — only
# the user who can open the file can give orders.
control unix:logs/control.sock;

events {
    worker_connections 1024;
}

http {
    types {
        text/html                 html htm;
        text/css                  css;
        application/javascript    js;
        application/json          json;
        image/png                 png;
        image/svg+xml             svg;
        text/plain                txt;
    }
    default_type application/octet-stream;

    access_log logs/access.log;

    server {
        listen 127.0.0.1:8080;
        server_name localhost;
        root html;
        index index.html;
    }
}
